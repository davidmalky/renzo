.modal-content{background:var(--bg-card);border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative}
.modal-header{padding:24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}

.form-group{margin-bottom:20px}

.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;transition:border-color var(--transition)}

<script>
// ============================================================================
// STATE MANAGEMENT
// ============================================================================
const appState = {
  currentView: 'dashboard',
  user: { id: 'user_001', name: 'Admin User', role: 'admin' },
  syncExecutions: [],
  syncMappings: [],
  conflicts: [],
  healthMetrics: {},
  configuration: {},
  filters: { status: '', dateRange: '', mappingName: '', search: '' },
  pagination: { page: 1, pageSize: 50, total: 0 },
  selectedExecutionId: null,
  wsConnection: null,
  autoRefreshInterval: null
};

// ============================================================================
// AUTHENTICATION & AUTHORIZATION
// ============================================================================
function authenticateUser(username, password) {
  // Mock authentication - replace with actual API call
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (username && password) {
        const user = { id: 'user_' + Date.now(), name: username, role: 'admin', token: 'jwt_' + Math.random().toString(36).substr(2) };
        appState.user = user;
        localStorage.setItem('authToken', user.token);
        resolve(user);
      } else {
        reject(new Error('Invalid credentials'));
      }
    }, 500);
  });
}

function logout() {
  appState.user = null;
  localStorage.removeItem('authToken');
  disconnectWebSocket();
  window.location.reload();
}

function checkAuthToken() {
  const token = localStorage.getItem('authToken');
  return token ? { valid: true, token } : { valid: false };
}

// ============================================================================
// NAVIGATION & VIEW MANAGEMENT
// ============================================================================
function navigateTo(viewName, params = {}) {
  const views = ['dashboard', 'history', 'execution-detail', 'health', 'conflicts', 'configuration'];
  if (!views.includes(viewName)) {
    console.error('Invalid view:', viewName);
    return;
  }
  
  appState.currentView = viewName;
  appState.selectedExecutionId = params.executionId || null;
  
  document.querySelectorAll('.nav-link').forEach(link => {
    link.classList.toggle('active', link.dataset.view === viewName);
  });
  
  document.querySelectorAll('.view').forEach(view => {
    view.classList.remove('active');
  });
  
  const targetView = document.getElementById(`${viewName}-view`);
  if (targetView) {
    targetView.classList.add('active');
    loadViewData(viewName, params);
  }
  
  if (window.innerWidth < 768) {
    closeMobileMenu();
  }
}

function loadViewData(viewName, params) {
  switch (viewName) {
    case 'dashboard':
      loadDashboardData();
      break;
    case 'history':
      loadSyncHistory(appState.filters, appState.pagination);
      break;
    case 'execution-detail':
      if (params.executionId) loadExecutionDetail(params.executionId);
      break;
    case 'health':
      loadHealthMetrics();
      break;
    case 'conflicts':
      loadConflicts();
      break;
    case 'configuration':
      loadConfiguration();
      break;
  }
}

function toggleMobileMenu() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobileOverlay');
  const isOpen = sidebar.classList.contains('mobile-open');
  
  sidebar.classList.toggle('mobile-open', !isOpen);
  overlay.classList.toggle('active', !isOpen);
  document.body.style.overflow = !isOpen ? 'hidden' : '';
}

function closeMobileMenu() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobileOverlay');
  sidebar.classList.remove('mobile-open');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

// ============================================================================
// MODAL MANAGEMENT
// ============================================================================
function openModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.add('active');
    modal.setAttribute('aria-hidden', 'false');
    const firstInput = modal.querySelector('input, button, select, textarea');
    if (firstInput) setTimeout(() => firstInput.focus(), 100);
    document.body.style.overflow = 'hidden';
  }
}

function closeModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.remove('active');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
}

function handleModalKeyboard(event, modalId) {
  if (event.key === 'Escape') {
    closeModal(modalId);
  } else if (event.key === 'Tab') {
    trapFocus(event, modalId);
  }
}

function trapFocus(event, modalId) {
  const modal = document.getElementById(modalId);
  const focusableElements = modal.querySelectorAll('button, input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])');
  const firstElement = focusableElements[0];
  const lastElement = focusableElements[focusableElements.length - 1];
  
  if (event.shiftKey && document.activeElement === firstElement) {
    event.preventDefault();
    lastElement.focus();
  } else if (!event.shiftKey && document.activeElement === lastElement) {
    event.preventDefault();
    firstElement.focus();
  }
}

// ============================================================================
// UTILITY FUNCTIONS
// ============================================================================
function formatDateTime(timestamp) {
  if (!timestamp) return 'N/A';
  const date = new Date(timestamp);
  return new Intl.DateTimeFormat('en-US', {
    month: 'short', day: 'numeric', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  }).format(date);
}

function formatDuration(ms) {
  if (!ms) return '0s';
  const seconds = Math.floor(ms / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  
  if (hours > 0) return `${hours}h ${minutes % 60}m`;
  if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
  return `${seconds}s`;
}

function formatNumber(num) {
  return new Intl.NumberFormat('en-US').format(num);
}

function formatPercent(value) {
  return `${(value * 100).toFixed(1)}%`;
}

function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

function showToast(message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  toast.style.cssText = 'position:fixed;top:20px;right:20px;padding:12px 24px;background:#333;color:#fff;border-radius:4px;z-index:10000;animation:slideIn 0.3s;';
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'slideOut 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function exportToCSV(data, filename) {
  const headers = Object.keys(data[0] || {});
  const csv = [
    headers.join(','),
    ...data.map(row => headers.map(h => JSON.stringify(row[h] || '')).join(','))
  ].join('\n');
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function generateId(prefix = 'id') {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
}

// ============================================================================
// WEBSOCKET CONNECTION
// ============================================================================
function connectWebSocket() {
  const wsUrl = 'ws://localhost:8080/ws';
  appState.wsConnection = new WebSocket(wsUrl);
  
  appState.wsConnection.onopen = () => {
    console.log('WebSocket connected');
    showToast('Real-time updates connected', 'success');
  };
  
  appState.wsConnection.onmessage = (event) => {
    const data = JSON.parse(event.data);
    handleWebSocketMessage(data);
  };
  
  appState.wsConnection.onerror = (error) => {
    console.error('WebSocket error:', error);
    showToast('Connection error - retrying...', 'error');
  };
  
  appState.wsConnection.onclose = () => {
    console.log('WebSocket disconnected');
    setTimeout(connectWebSocket, 5000);
  };
}

function disconnectWebSocket() {
  if (appState.wsConnection) {
    appState.wsConnection.close();
    appState.wsConnection = null;
  }
}

function handleWebSocketMessage(data) {
  switch (data.type) {
    case 'sync.started':
    case 'sync.completed':
    case 'sync.failed':
      if (appState.currentView === 'dashboard') loadDashboardData();
      if (appState.currentView === 'history') loadSyncHistory(appState.filters, appState.pagination);
      break;
    case 'conflict.detected':
      appState.conflicts.unshift(data.payload);
      if (appState.currentView === 'conflicts') loadConflicts();
      break;
    case 'health.alert':
      showToast(data.payload.message, 'warning');
      if (appState.currentView === 'health') loadHealthMetrics();
      break;
  }
}
</script>

<script>
// ============================================================================
// SYNC EXECUTION FUNCTIONS
// ============================================================================
async function startSyncExecution(mappingId, triggeredBy, isManual = false) {
  const executionId = generateId('exec');
  const execution = {
    id: executionId,
    mapping_id: mappingId,
    triggered_by: triggeredBy,
    is_manual: isManual,
    status: 'pending',
    started_at: new Date().toISOString(),
    records_processed: 0,
    errors: 0
  };
  
  const existingRunning = appState.executions.find(e => e.mapping_id === mappingId && e.status === 'running');
  if (existingRunning) {
    throw new Error('Sync already running for this mapping');
  }
  
  appState.executions.unshift(execution);
  
  if (appState.wsConnection && appState.wsConnection.readyState === WebSocket.OPEN) {
    appState.wsConnection.send(JSON.stringify({ type: 'sync.start', payload: { executionId, mappingId } }));
  }
  
  showToast('Sync execution started', 'success');
  return executionId;
}

async function pollSalesforceChanges(mappingId, lastSyncTimestamp) {
  const mapping = appState.mappings.find(m => m.id === mappingId);
  if (!mapping) throw new Error('Mapping not found');
  
  const query = `SELECT ${mapping.source_fields.join(', ')}, LastModifiedDate, Id FROM ${mapping.source_object} WHERE LastModifiedDate > ${lastSyncTimestamp} ORDER BY LastModifiedDate ASC LIMIT 2000`;
  
  const response = await apiRequest('/api/salesforce/query', 'POST', { query });
  
  return response.records.map(record => ({
    id: record.Id,
    fields: mapping.source_fields.reduce((acc, field) => ({ ...acc, [field]: record[field] }), {}),
    lastModifiedDate: record.LastModifiedDate,
    isDeleted: false
  }));
}

async function processRecordBatch(executionId, records, transformations) {
  const results = [];
  
  for (const record of records) {
    try {
      const transformed = applyTransformations(record, transformations);
      const validated = validateRecord(transformed);
      results.push({ record_id: record.id, status: 'success', data: validated });
    } catch (error) {
      results.push({ record_id: record.id, status: 'error', error: error.message });
    }
  }
  
  return results;
}

function applyTransformations(record, transformations) {
  const result = { ...record.fields };
  
  for (const transform of transformations) {
    if (transform.type === 'map') {
      result[transform.target_field] = result[transform.source_field];
      delete result[transform.source_field];
    } else if (transform.type === 'format') {
      result[transform.field] = formatValue(result[transform.field], transform.format);
    } else if (transform.type === 'default') {
      result[transform.field] = result[transform.field] || transform.default_value;
    }
  }
  
  return result;
}

function formatValue(value, format) {
  if (!value) return value;
  
  if (format === 'uppercase') return String(value).toUpperCase();
  if (format === 'lowercase') return String(value).toLowerCase();
  if (format === 'date') return new Date(value).toISOString().split('T')[0];
  if (format === 'phone') return value.replace(/\D/g, '').replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3');
  
  return value;
}

function validateRecord(record) {
  const errors = [];
  
  for (const [field, value] of Object.entries(record)) {
    if (field.endsWith('Email') && value && !value.includes('@')) {
      errors.push(`Invalid email format: ${field}`);
    }
    if (field.endsWith('Phone') && value && value.replace(/\D/g, '').length < 10) {
      errors.push(`Invalid phone format: ${field}`);
    }
  }
  
  if (errors.length > 0) throw new Error(errors.join('; '));
  return record;
}

async function detectConflicts(sourceRecord, destRecord) {
  const conflicts = [];
  
  for (const field in sourceRecord) {
    if (sourceRecord[field] !== destRecord[field] && destRecord[field]) {
      conflicts.push({
        field,
        source_value: sourceRecord[field],
        dest_value: destRecord[field],
        source_modified: sourceRecord.lastModifiedDate,
        dest_modified: destRecord.lastModifiedDate
      });
    }
  }
  
  return conflicts;
}

function resolveConflict(conflict, strategy) {
  if (strategy === 'source_wins') return conflict.source_value;
  if (strategy === 'dest_wins') return conflict.dest_value;
  if (strategy === 'newest_wins') {
    return new Date(conflict.source_modified) > new Date(conflict.dest_modified) 
      ? conflict.source_value 
      : conflict.dest_value;
  }
  if (strategy === 'manual') return null;
  
  return conflict.source_value;
}

// ============================================================================
// DATA LOADING FUNCTIONS
// ============================================================================
async function loadDashboardData() {
  try {
    const stats = calculateDashboardStats();
    const activities = getRecentActivities(10);
    
    renderDashboardStats(stats);
    renderActivityFeed(activities);
  } catch (error) {
    showToast('Failed to load dashboard data', 'error');
  }
}

function calculateDashboardStats() {
  const now = Date.now();
  const last24h = now - 24 * 60 * 60 * 1000;
  const lastHour = now - 60 * 60 * 1000;
  
  const activeSync = appState.executions.filter(e => e.status === 'running').length;
  const queuedJobs = appState.executions.filter(e => e.status === 'pending').length;
  
  const recent = appState.executions.filter(e => new Date(e.started_at).getTime() > last24h);
  const successRate = recent.length ? (recent.filter(e => e.status === 'completed').length / recent.length * 100).toFixed(1) : 0;
  
  const failedLastHour = appState.executions.filter(e => 
    e.status === 'failed' && new Date(e.started_at).getTime() > lastHour
  ).length;
  
  const completed = appState.executions.filter(e => e.status === 'completed' && e.duration);
  const avgSyncTime = completed.length ? (completed.reduce((sum, e) => sum + e.duration, 0) / completed.length / 1000).toFixed(1) : 0;
  
  return { activeSync, queuedJobs, successRate, failedLastHour, avgSyncTime };
}

function getRecentActivities(limit = 10) {
  return appState.executions
    .slice(0, limit)
    .map(e => ({
      id: e.id,
      mapping_name: appState.mappings.find(m => m.id === e.mapping_id)?.name || 'Unknown',
      status: e.status,
      started_at: e.started_at,
      duration: e.duration,
      records_processed: e.records_processed,
      errors: e.errors
    }));
}

async function loadSyncHistory(filters, pagination) {
  try {
    let filtered = [...appState.executions];
    
    if (filters.status && filters.status !== 'all') {
      filtered = filtered.filter(e => e.status === filters.status);
    }
    
    if (filters.mappingName) {
      const mapping = appState.mappings.find(m => m.name.toLowerCase().includes(filters.mappingName.toLowerCase()));
      if (mapping) filtered = filtered.filter(e => e.mapping_id === mapping.id);
    }
    
    if (filters.dateRange) {
      const [start, end] = filters.dateRange;
      filtered = filtered.filter(e => {
        const date = new Date(e.started_at);
        return date >= start && date <= end;
      });
    }
    
    const start = (pagination.page - 1) * pagination.pageSize;
    const end = start + pagination.pageSize;
    const paged = filtered.slice(start, end);
    
    renderSyncHistoryTable(paged, filtered.length, pagination);
  } catch (error) {
    showToast('Failed to load sync history', 'error');
  }
}

async function loadExecutionDetails(executionId) {
  const execution = appState.executions.find(e => e.id === executionId);
  if (!execution) {
    showToast('Execution not found', 'error');
    return;
  }
  
  renderExecutionDetails(execution);
}

async function loadConflicts() {
  renderConflictsTable(appState.conflicts);
}

async function loadHealthMetrics() {
  const metrics = {
    uptime: calculateUptime(),
    errorRate: calculateErrorRate(),
    apiCalls: appState.executions.reduce((sum, e) => sum + (e.api_calls || 0), 0),
    avgResponseTime: calculateAvgResponseTime()
  };
  
  renderHealthDashboard(metrics);
}

function calculateUptime() {
  return '99.8%';
}

function calculateErrorRate() {
  const last24h = Date.now() - 24 * 60 * 60 * 1000;
  const recent = appState.executions.filter(e => new Date(e.started_at).getTime() > last24h);
  if (!recent.length) return [];
  
  const hourly = Array(24).fill(0).map((_, i) => {
    const hour = last24h + i * 60 * 60 * 1000;
    const hourExecs = recent.filter(e => {
      const t = new Date(e.started_at).getTime();
      return t >= hour && t < hour + 60 * 60 * 1000;
    });
    const failed = hourExecs.filter(e => e.status === 'failed').length;
    return { hour: new Date(hour), rate: hourExecs.length ? (failed / hourExecs.length * 100).toFixed(1) : 0 };
  });
  
  return hourly;
}

function calculateAvgResponseTime() {
  const completed = appState.executions.filter(e => e.status === 'completed' && e.duration);
  return completed.length ? (completed.reduce((sum, e) => sum + e.duration, 0) / completed.length).toFixed(0) : 0;
}

// ============================================================================
// EVENT LISTENERS
// ============================================================================
document.addEventListener('DOMContentLoaded', () => {
  initializeApp();
  setupEventListeners();
  connectWebSocket();
  
  if (appState.autoRefresh) {
    appState.refreshInterval = setInterval(() => {
      if (appState.currentView === 'dashboard') loadDashboardData();
    }, 10000);
  }
});

function setupEventListeners() {
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && appState.activeModal) {
      closeModal();
    }
    
    if (e.key === 'Tab' && appState.activeModal) {
      handleModalTabNavigation(e);
    }
  });
  
  window.addEventListener('beforeunload', () => {
    disconnectWebSocket();
    if (appState.refreshInterval) clearInterval(appState.refreshInterval);
  });
}

function handleModalTabNavigation(e) {
  const modal = document.getElementById(appState.activeModal);
  if (!modal) return;
  
  const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

window.addEventListener('resize', debounce(() => {
  if (window.innerWidth < 768 && !document.body.classList.contains('sidebar-collapsed')) {
    document.body.classList.add('sidebar-collapsed');
  }
}, 250));
</script>
