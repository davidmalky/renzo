<script>
// ==================== STATE MANAGEMENT ====================
const AppState = {
  currentView: 'monitor',
  syncHistory: [],
  runningSyncs: [],
  mappings: [],
  pollingInterval: null,
  filters: { dateFrom: '', dateTo: '', mapping: '', status: '' }
};

// ==================== LOCALSTORAGE HELPERS ====================
const Storage = {
  get(key) {
    try {
      const item = localStorage.getItem(key);
      return item ? JSON.parse(item) : null;
    } catch (e) {
      console.error('Storage get error:', e);
      return null;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      console.error('Storage set error:', e);
    }
  },
  remove(key) {
    localStorage.removeItem(key);
  }
};

// ==================== MODAL MANAGEMENT ====================
const Modal = {
  activeModal: null,
  focusTrap: null,

  open(modalElement) {
    this.activeModal = modalElement;
    modalElement.style.display = 'flex';
    this.setupFocusTrap(modalElement);
    this.setupKeyboardHandlers();
    modalElement.querySelector('[tabindex="0"]')?.focus();
  },

  close(modalElement = this.activeModal) {
    if (!modalElement) return;
    modalElement.style.display = 'none';
    this.activeModal = null;
    this.removeFocusTrap();
    this.removeKeyboardHandlers();
  },

  setupFocusTrap(modalElement) {
    const focusableElements = modalElement.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    );
    this.focusTrap = Array.from(focusableElements);
    
    if (this.focusTrap.length > 0) {
      this.focusTrap[0].focus();
    }
  },

  removeFocusTrap() {
    this.focusTrap = null;
  },

  handleKeydown(e) {
    if (e.key === 'Escape') {
      Modal.close();
    } else if (e.key === 'Tab' && Modal.focusTrap) {
      const firstElement = Modal.focusTrap[0];
      const lastElement = Modal.focusTrap[Modal.focusTrap.length - 1];
      
      if (e.shiftKey && document.activeElement === firstElement) {
        e.preventDefault();
        lastElement.focus();
      } else if (!e.shiftKey && document.activeElement === lastElement) {
        e.preventDefault();
        firstElement.focus();
      }
    }
  },

  setupKeyboardHandlers() {
    document.addEventListener('keydown', this.handleKeydown);
  },

  removeKeyboardHandlers() {
    document.removeEventListener('keydown', this.handleKeydown);
  }
};

// ==================== NAVIGATION ====================
function navigateToView(viewName) {
  document.querySelectorAll('.nav-link').forEach(link => {
    link.classList.remove('active');
  });
  
  const activeLink = document.querySelector(`[data-view="${viewName}"]`);
  if (activeLink) {
    activeLink.classList.add('active');
  }
  
  AppState.currentView = viewName;
  
  if (viewName === 'monitor') {
    renderDashboard();
  }
}

// ==================== DATE/TIME UTILITIES ====================
const DateUtils = {
  format(timestamp, includeTime = true) {
    const date = new Date(timestamp);
    const dateStr = date.toLocaleDateString('en-US', { 
      year: 'numeric', month: 'short', day: 'numeric' 
    });
    
    if (!includeTime) return dateStr;
    
    const timeStr = date.toLocaleTimeString('en-US', { 
      hour: '2-digit', minute: '2-digit' 
    });
    return `${dateStr} ${timeStr}`;
  },

  formatDuration(ms) {
    if (ms < 1000) return `${ms}ms`;
    const seconds = Math.floor(ms / 1000);
    if (seconds < 60) return `${seconds}s`;
    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;
    return `${minutes}m ${remainingSeconds}s`;
  },

  getElapsedTime(startTime) {
    return Date.now() - startTime;
  },

  isToday(timestamp) {
    const date = new Date(timestamp);
    const today = new Date();
    return date.toDateString() === today.toDateString();
  }
};

// ==================== NUMBER FORMATTING ====================
const NumberUtils = {
  format(num) {
    return new Intl.NumberFormat('en-US').format(num);
  },

  formatPercentage(value, decimals = 1) {
    return `${value.toFixed(decimals)}%`;
  }
};

// ==================== DATA INITIALIZATION ====================
function initializeData() {
  let mappings = Storage.get('syncMappings');
  if (!mappings || mappings.length === 0) {
    mappings = [
      { id: 'map-1', name: 'Salesforce to HubSpot', source: 'Salesforce', target: 'HubSpot', enabled: true },
      { id: 'map-2', name: 'Shopify to QuickBooks', source: 'Shopify', target: 'QuickBooks', enabled: true }
    ];
    Storage.set('syncMappings', mappings);
  }
  AppState.mappings = mappings;

  let syncHistory = Storage.get('syncHistory');
  if (!syncHistory || syncHistory.length === 0) {
    syncHistory = generateMockSyncHistory();
    Storage.set('syncHistory', syncHistory);
  }
  AppState.syncHistory = syncHistory;

  let runningSyncs = Storage.get('runningSyncs') || [];
  AppState.runningSyncs = runningSyncs;
}

function generateMockSyncHistory() {
  const history = [];
  const now = Date.now();
  const statuses = ['success', 'failed', 'warning'];
  
  for (let i = 0; i < 15; i++) {
    const mapping = AppState.mappings[i % AppState.mappings.length];
    const status = statuses[Math.floor(Math.random() * statuses.length)];
    const totalRecords = Math.floor(Math.random() * 1000) + 100;
    const processedRecords = status === 'success' ? totalRecords : Math.floor(totalRecords * 0.9);
    const failedRecords = totalRecords - processedRecords;
    
    history.push({
      id: `sync-${Date.now()}-${i}`,
      mappingId: mapping.id,
      mappingName: mapping.name,
      startTime: now - (i * 3600000),
      endTime: now - (i * 3600000) + Math.floor(Math.random() * 300000),
      status: status,
      totalRecords: totalRecords,
      processedRecords: processedRecords,
      failedRecords: failedRecords,
      duration: Math.floor(Math.random() * 300000)
    });
  }
  
  return history.sort((a, b) => b.startTime - a.startTime);
}

// ==================== AUTHENTICATION (STUB) ====================
const Auth = {

    return true;
  },
  getCurrentUser() {
    return { name: 'Admin User', email: 'admin@example.com' };
  }
};

// ==================== SYNC MONITOR INITIALIZATION ====================
function initializeSyncMonitor() {
  if (!Auth.isAuthenticated()) {
    window.location.href = '/login';
    return;
  }

  initializeData();
  setupEventListeners();
  renderDashboard();
  startPollingLoop();
}

// ==================== EVENT LISTENERS ====================
function setupEventListeners() {
  // Navigation
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', handleNavigation);
  });

  // Filter controls
  const dateRangeSelect = document.getElementById('dateRange');
  const mappingFilterSelect = document.getElementById('mappingFilter');
  const statusFilterSelect = document.getElementById('statusFilter');

  if (dateRangeSelect) {
    dateRangeSelect.addEventListener('change', applyFilters);
  }
  if (mappingFilterSelect) {
    mappingFilterSelect.addEventListener('change', applyFilters);
  }
  if (statusFilterSelect) {
    statusFilterSelect.addEventListener('change', applyFilters);
  }

  // Manual trigger button
  const triggerBtn = document.getElementById('triggerSyncBtn');
  if (triggerBtn) {
    triggerBtn.addEventListener('click', openTriggerDialog);
  }

  // Refresh button
  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) {
    refreshBtn.setAttribute('aria-label', 'Refresh sync data');
    refreshBtn.addEventListener('click', () => {
      fetchLiveSyncStatus();
      applyFilters();
    });
  }

  // Keyboard navigation for modals
  document.addEventListener('keydown', handleGlobalKeydown);
}

function handleNavigation(e) {
  e.preventDefault();
  const view = e.currentTarget.dataset.view;
  
  document.querySelectorAll('.nav-link').forEach(link => {
    link.classList.remove('active');
  });
  e.currentTarget.classList.add('active');

  document.querySelectorAll('.view').forEach(viewEl => {
    viewEl.classList.remove('active');
  });
  
  const targetView = document.getElementById(view);
  if (targetView) {
    targetView.classList.add('active');
  }
}

function handleGlobalKeydown(e) {
  if (e.key === 'Escape') {
    closeAllModals();
  }
}

// ==================== POLLING LOOP ====================
function startPollingLoop() {
  if (AppState.pollingInterval) {
    clearInterval(AppState.pollingInterval);
  }

  AppState.pollingInterval = setInterval(() => {
    if (!document.hidden) {
      fetchLiveSyncStatus();
    }
  }, 3000);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearInterval(AppState.pollingInterval);
    } else {
      startPollingLoop();
    }
  });
}

function fetchLiveSyncStatus() {
  const runningSyncs = Storage.get('runningSyncs') || [];
  const updatedSyncs = [];

  runningSyncs.forEach(sync => {
    const elapsed = DateUtils.getElapsedTime(sync.startTime);
    const progress = Math.min((sync.processedRecords / sync.totalRecords) * 100, 100);

    if (progress >= 100 || elapsed > 600000) {
      completeSyncJob(sync);
    } else {
      sync.processedRecords = Math.min(
        sync.processedRecords + Math.floor(Math.random() * 50) + 10,
        sync.totalRecords
      );
      sync.failedRecords = Math.floor(Math.random() * 5);
      updatedSyncs.push(sync);
    }
  });

  Storage.set('runningSyncs', updatedSyncs);
  AppState.runningSyncs = updatedSyncs;
  renderLiveSyncWidget(updatedSyncs);
}

function completeSyncJob(sync) {
  const completedSync = {
    ...sync,
    endTime: Date.now(),
    duration: Date.now() - sync.startTime,
    status: sync.failedRecords > 0 ? 'warning' : 'success',
    processedRecords: sync.totalRecords - sync.failedRecords
  };

  AppState.syncHistory.unshift(completedSync);
  Storage.set('syncHistory', AppState.syncHistory);
  
  showNotification(`Sync completed: ${sync.mappingName}`, completedSync.status);
  applyFilters();
}

// ==================== RENDER FUNCTIONS ====================
function renderDashboard() {
  renderMetricsCards();
  renderLiveSyncWidget(AppState.runningSyncs);
  populateMappingFilters();
  applyFilters();
}

function renderMetricsCards() {
  const todaySyncs = AppState.syncHistory.filter(s => DateUtils.isToday(s.startTime));
  const totalSyncs = todaySyncs.length;
  const successfulSyncs = todaySyncs.filter(s => s.status === 'success').length;
  const successRate = totalSyncs > 0 ? (successfulSyncs / totalSyncs) * 100 : 0;
  
  const avgDuration = todaySyncs.length > 0
    ? todaySyncs.reduce((sum, s) => sum + s.duration, 0) / todaySyncs.length
    : 0;
  
  const totalRecords = todaySyncs.reduce((sum, s) => sum + s.processedRecords, 0);

  document.getElementById('totalSyncsToday').textContent = totalSyncs;
  document.getElementById('successRate').textContent = NumberUtils.formatPercentage(successRate);
  document.getElementById('avgDuration').textContent = DateUtils.formatDuration(avgDuration);
  document.getElementById('totalRecords').textContent = NumberUtils.format(totalRecords);
}

function renderLiveSyncWidget(runningSyncs) {
  const container = document.getElementById('liveSyncContainer');
  
  if (runningSyncs.length === 0) {
    container.innerHTML = '<p class="empty-message">No active syncs running</p>';
    return;
  }

  container.innerHTML = runningSyncs.map(sync => {
    const progress = Math.min((sync.processedRecords / sync.totalRecords) * 100, 100);
    const elapsed = DateUtils.getElapsedTime(sync.startTime);

    return `
      <div class="live-sync-item">
        <div class="sync-header">
          <strong>${UIUtils.escapeHtml(sync.mappingName)}</strong>
          <span class="elapsed-time">${DateUtils.formatDuration(elapsed)}</span>
        </div>
        <div class="sync-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
          <span class="progress-text">${NumberUtils.formatPercentage(progress, 0)}</span>
        </div>
        <div class="sync-stats">
          <span>Processed: ${NumberUtils.format(sync.processedRecords)}</span>
          <span>Total: ${NumberUtils.format(sync.totalRecords)}</span>
          <span class="failed">Failed: ${NumberUtils.format(sync.failedRecords)}</span>
          <button class="btn-icon" onclick="cancelSync('${sync.id}')" aria-label="Cancel sync">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderSyncHistoryTable(syncRecords) {
  const tbody = document.getElementById('syncHistoryBody');
  
  if (syncRecords.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-message">No sync history found</td></tr>';
    return;
  }

  tbody.innerHTML = syncRecords.slice(0, 10).map(sync => `
    <tr>
      <td>${UIUtils.escapeHtml(sync.mappingName)}</td>
      <td>${DateUtils.formatTimestamp(sync.startTime)}</td>
      <td>${DateUtils.formatDuration(sync.duration)}</td>
      <td><span class="badge badge-${sync.status}">${sync.status}</span></td>
      <td>${NumberUtils.format(sync.processedRecords)}</td>
      <td>${NumberUtils.format(sync.totalRecords)}</td>
      <td>${NumberUtils.format(sync.failedRecords)}</td>
      <td>
        <button class="btn-secondary btn-sm" onclick="viewSyncDetails('${sync.id}')">Details</button>
      </td>
    </tr>
  `).join('');
}

// ==================== FILTER FUNCTIONS ====================
function populateMappingFilters() {
  const select = document.getElementById('mappingFilter');
  const triggerSelect = document.getElementById('triggerMappingSelect');
  
  const options = AppState.mappings.map(m => 
    `<option value="${m.id}">${UIUtils.escapeHtml(m.name)}</option>`
  ).join('');

  if (select) {
    select.innerHTML = '<option value="">All Mappings</option>' + options;
  }
  if (triggerSelect) {
    triggerSelect.innerHTML = '<option value="">Select Mapping</option>' + options;
  }
}

function applyFilters() {
  const dateRange = document.getElementById('dateRange')?.value || 'all';
  const mappingId = document.getElementById('mappingFilter')?.value || '';
  const status = document.getElementById('statusFilter')?.value || '';

  let filtered = [...AppState.syncHistory];

  if (dateRange !== 'all') {
    const now = Date.now();
    const ranges = {
      'today': 86400000,
      'week': 604800000,
      'month': 2592000000
    };
    const cutoff = now - ranges[dateRange];
    filtered = filtered.filter(s => s.startTime >= cutoff);
  }

  if (mappingId) {
    filtered = filtered.filter(s => s.mappingId === mappingId);
  }

  if (status) {
    filtered = filtered.filter(s => s.status === status);
  }

  AppState.filteredHistory = filtered;
  renderSyncHistoryTable(filtered);
}

// ==================== MODAL FUNCTIONS ====================
function openTriggerDialog() {
  const modal = document.getElementById('triggerDialog');
  modal.classList.add('active');
  trapFocus(modal);
}

function closeTriggerDialog() {
  document.getElementById('triggerDialog').classList.remove('active');
}

function confirmTriggerSync() {
  const mappingId = document.getElementById('triggerMappingSelect').value;
  const syncType = document.getElementById('syncType').value;
  const batchSize = parseInt(document.getElementById('batchSize').value);

  if (!mappingId) {
    showNotification('Please select a mapping', 'error');
    return;
  }

  const mapping = AppState.mappings.find(m => m.id === mappingId);
  triggerManualSync(mappingId, { syncType, batchSize });
  closeTriggerDialog();
}

function triggerManualSync(mappingId, options) {
  const mapping = AppState.mappings.find(m => m.id === mappingId);
  
  const syncJob = {
    id: `sync-${Date.now()}`,
    mappingId: mappingId,
    mappingName: mapping.name,
    startTime: Date.now(),
    totalRecords: Math.floor(Math.random() * 1000) + 200,
    processedRecords: 0,
    failedRecords: 0,
    options: options
  };

  AppState.runningSyncs.push(syncJob);
  Storage.set('runningSyncs', AppState.runningSyncs);
  
  showNotification(`Sync started: ${mapping.name}`, 'success');
  renderLiveSyncWidget(AppState.runningSyncs);
}

function cancelSync(syncId) {
  const index = AppState.runningSyncs.findIndex(s => s.id === syncId);
  if (index !== -1) {
    const sync = AppState.runningSyncs[index];
    completeSyncJob({ ...sync, status: 'cancelled', failedRecords: sync.totalRecords - sync.processedRecords });
    AppState.runningSyncs.splice(index, 1);
    Storage.set('runningSyncs', AppState.runningSyncs);
    renderLiveSyncWidget(AppState.runningSyncs);
  }
}

function viewSyncDetails(syncId) {
  const sync = AppState.syncHistory.find(s => s.id === syncId);
  if (!sync) return;

  const modal = document.getElementById('syncDetailModal');
  document.getElementById('detailMappingName').textContent = sync.mappingName;
  document.getElementById('detailTimestamp').textContent = DateUtils.formatTimestamp(sync.startTime);
  document.getElementById('detailDuration').textContent = DateUtils.formatDuration(sync.duration);
  document.getElementById('detailStatus').textContent = sync.status;
  document.getElementById('detailStatus').className = `badge badge-${sync.status}`;
  document.getElementById('detailProcessed').textContent = NumberUtils.format(sync.processedRecords);
  document.getElementById('detailFailed').textContent = NumberUtils.format(sync.failedRecords);

  modal.classList.add('active');
  trapFocus(modal);
}

function closeAllModals() {
  document.querySelectorAll('.modal').forEach(modal => {
    modal.classList.remove('active');
  });
}

function trapFocus(element) {
  const focusableElements = element.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  const firstElement = focusableElements[0];
  const lastElement = focusableElements[focusableElements.length - 1];

  element.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      if (e.shiftKey && document.activeElement === firstElement) {
        e.preventDefault();
        lastElement.focus();
      } else if (!e.shiftKey && document.activeElement === lastElement) {
        e.preventDefault();
        firstElement.focus();
      }
    }
  });

  firstElement?.focus();
}

// ==================== NOTIFICATION ====================
function showNotification(message, type = 'info') {
  const notification = document.createElement('div');
  notification.className = `notification notification-${type}`;
  notification.textContent = message;
  notification.setAttribute('role', 'alert');
  
  document.body.appendChild(notification);
  
  setTimeout(() => {
    notification.classList.add('show');
  }, 10);

  setTimeout(() => {
    notification.classList.remove('show');
    setTimeout(() => notification.remove(), 300);
  }, 3000);
}

// ==================== INITIALIZATION ====================
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initializeSyncMonitor);
} else {
  initializeSyncMonitor();
}
</script>
