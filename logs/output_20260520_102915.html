<script>
// ============================================================================
// CORE JAVASCRIPT - Data Management, Auth, Navigation, Utilities
// ============================================================================

// Global State
const state = {
  currentUser: null,
  currentProject: null,
  mappings: [],
  executionResults: null,
  functionLibrary: [],
  expressionTemplates: [],
  activeModal: null,
  functionPanelOpen: false,
  debugMode: false,
  validationErrors: []
};

// Authentication & User Management
function initAuth() {
  const savedUser = localStorage.getItem('currentUser');
  if (savedUser) {
    state.currentUser = JSON.parse(savedUser);
    updateUserDisplay();
  }
}

function login(email, password) {
  // Simulate auth - replace with real API call
  const user = { id: 1, email, name: email.split('@')[0] };
  state.currentUser = user;
  localStorage.setItem('currentUser', JSON.stringify(user));
  updateUserDisplay();
  return user;
}

function logout() {
  state.currentUser = null;
  localStorage.removeItem('currentUser');
  updateUserDisplay();
}

function updateUserDisplay() {
  const userDisplay = document.querySelector('.user-profile');
  if (userDisplay && state.currentUser) {
    userDisplay.textContent = state.currentUser.name || state.currentUser.email;
  }
}

// Data Management
function loadMappings() {
  const saved = localStorage.getItem('mappings');
  state.mappings = saved ? JSON.parse(saved) : [];
  return state.mappings;
}

function saveMappings() {
  localStorage.setItem('mappings', JSON.stringify(state.mappings));
}

function createMapping(name, sourceType, targetType) {
  const mapping = {
    id: generateId(),
    name,
    sourceType,
    targetType,
    fieldMappings: [],
    created: new Date().toISOString(),
    updated: new Date().toISOString()
  };
  state.mappings.push(mapping);
  saveMappings();
  return mapping;
}

function updateMapping(id, updates) {
  const index = state.mappings.findIndex(m => m.id === id);
  if (index !== -1) {
    state.mappings[index] = { ...state.mappings[index], ...updates, updated: new Date().toISOString() };
    saveMappings();
    return state.mappings[index];
  }
  return null;
}

function deleteMapping(id) {
  state.mappings = state.mappings.filter(m => m.id !== id);
  saveMappings();
}

function getMappingById(id) {
  return state.mappings.find(m => m.id === id);
}

// Function Library Management
function loadFunctionLibrary() {
  state.functionLibrary = [
    // String Functions
    { id: 'uppercase', category: 'String', name: 'UPPERCASE', description: 'Converts text to uppercase', signature: 'UPPERCASE(text)', params: ['text'] },
    { id: 'lowercase', category: 'String', name: 'LOWERCASE', description: 'Converts text to lowercase', signature: 'LOWERCASE(text)', params: ['text'] },
    { id: 'trim', category: 'String', name: 'TRIM', description: 'Removes leading/trailing whitespace', signature: 'TRIM(text)', params: ['text'] },
    { id: 'concat', category: 'String', name: 'CONCAT', description: 'Joins multiple values', signature: 'CONCAT(value1, value2, ...)', params: ['values'], variadic: true },
    { id: 'substring', category: 'String', name: 'SUBSTRING', description: 'Extracts part of text', signature: 'SUBSTRING(text, start, length)', params: ['text', 'start', 'length'] },

    // Date Functions

    { id: 'formatdate', category: 'Date', name: 'FORMATDATE', description: 'Formats date to string', signature: 'FORMATDATE(date, format)', params: ['date', 'format'] },
    { id: 'parsedate', category: 'Date', name: 'PARSEDATE', description: 'Parses string to date', signature: 'PARSEDATE(text, format)', params: ['text', 'format'] },
    { id: 'dateadd', category: 'Date', name: 'DATEADD', description: 'Adds time to date', signature: 'DATEADD(date, amount, unit)', params: ['date', 'amount', 'unit'] },
    
    // Math Functions
    { id: 'add', category: 'Math', name: 'ADD', description: 'Adds numbers', signature: 'ADD(num1, num2, ...)', params: ['numbers'], variadic: true },
    { id: 'subtract', category: 'Math', name: 'SUBTRACT', description: 'Subtracts numbers', signature: 'SUBTRACT(num1, num2)', params: ['num1', 'num2'] },
    { id: 'multiply', category: 'Math', name: 'MULTIPLY', description: 'Multiplies numbers', signature: 'MULTIPLY(num1, num2, ...)', params: ['numbers'], variadic: true },
    { id: 'divide', category: 'Math', name: 'DIVIDE', description: 'Divides numbers', signature: 'DIVIDE(num1, num2)', params: ['num1', 'num2'] },

    { id: 'coalesce', category: 'Conditional', name: 'COALESCE', description: 'Returns first non-empty value', signature: 'COALESCE(value1, value2, ...)', params: ['values'], variadic: true },
    
    // Array Functions
    { id: 'join', category: 'Array', name: 'JOIN', description: 'Joins array with separator', signature: 'JOIN(array, separator)', params: ['array', 'separator'] },
    { id: 'split', category: 'Array', name: 'SPLIT', description: 'Splits text into array', signature: 'SPLIT(text, separator)', params: ['text', 'separator'] },
    { id: 'first', category: 'Array', name: 'FIRST', description: 'Gets first array element', signature: 'FIRST(array)', params: ['array'] },
    { id: 'last', category: 'Array', name: 'LAST', description: 'Gets last array element', signature: 'LAST(array)', params: ['array'] },
    
    // Lookup Functions
    { id: 'lookup', category: 'Lookup', name: 'LOOKUP', description: 'Looks up value from mapping table', signature: 'LOOKUP(value, mappingTable)', params: ['value', 'mappingTable'] },
    { id: 'vlookup', category: 'Lookup', name: 'VLOOKUP', description: 'Vertical lookup', signature: 'VLOOKUP(value, table, column)', params: ['value', 'table', 'column'] }

// Template Management
function loadExpressionTemplates() {
  const saved = localStorage.getItem('expressionTemplates');
  state.expressionTemplates = saved ? JSON.parse(saved) : [];
}

function saveExpressionTemplate(name, expression, description) {
  const template = {
    id: generateId(),
    name,
    expression,
    description,
    created: new Date().toISOString()
  };
  state.expressionTemplates.push(template);
  localStorage.setItem('expressionTemplates', JSON.stringify(state.expressionTemplates));
  return template;
}

function deleteExpressionTemplate(id) {
  state.expressionTemplates = state.expressionTemplates.filter(t => t.id !== id);
  localStorage.setItem('expressionTemplates', JSON.stringify(state.expressionTemplates));
}

// Utility Functions
function generateId() {
  return `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
}

function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

function deepClone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function formatDate(date) {
  return new Date(date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Navigation
function navigateTo(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const targetView = document.getElementById(`${view}-view`);
  if (targetView) {
    targetView.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const navItem = document.querySelector(`.nav-item[data-view="${view}"]`);
    if (navItem) navItem.classList.add('active');
  }
}

// Initialize Application
function initApp() {
  initAuth();
  loadMappings();
  loadFunctionLibrary();
  loadExpressionTemplates();
  setupEventListeners();
  renderMappingList();
  navigateTo('mappings');
}

// Wait for DOM to load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

// Feature-specific Functions

// Transformation System
function initTransformationSystem() {
  setupFunctionPanelToggle();
  setupDragAndDrop();
  setupModalHandlers();
}

function setupFunctionPanelToggle() {
  const toggleBtn = document.getElementById('toggle-functions-btn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', toggleFunctionLibraryPanel);
  }
}

function toggleFunctionLibraryPanel() {
  const panel = document.getElementById('function-library-panel');
  const isOpen = panel.classList.contains('open');
  
  if (isOpen) {
    panel.classList.remove('open');
    document.body.classList.remove('function-panel-open');
  } else {
    panel.classList.add('open');
    document.body.classList.add('function-panel-open');
    renderFunctionLibraryPanel();
  }
}

function renderFunctionLibraryPanel() {
  const container = document.getElementById('function-categories');
  const categories = [...new Set(state.functionLibrary.map(f => f.category))];
  
  container.innerHTML = categories.map(category => {
    const functions = state.functionLibrary.filter(f => f.category === category);
    return `
      <div class="function-category">
        <div class="function-category-header" onclick="toggleCategory(this)">
          <span class="category-icon">${getCategoryIcon(category)}</span>
          <span>${category}</span>
          <span class="collapse-icon">▼</span>
        </div>
        <div class="function-chips">
          ${functions.map(fn => createFunctionChipHTML(fn)).join('')}
        </div>
      </div>
    `;
  }).join('');
  
  attachDragHandlers();
}

function getCategoryIcon(category) {
  const icons = {
    'String': '📝',
    'Date': '📅',
    'Math': '🔢',
    'Conditional': '🔀',
    'Array': '📋',
    'Lookup': '🔍'
  };
  return icons[category] || '⚙️';
}

function createFunctionChipHTML(fn) {
  return `
    <div class="function-chip" draggable="true" 
         data-function-id="${fn.id}"
         data-category="${fn.category}"
         data-signature="${escapeHtml(fn.signature)}"
         title="${escapeHtml(fn.description)}">
      <span class="chip-icon">${getCategoryIcon(fn.category)}</span>
      <span class="chip-name">${fn.name}</span>
    </div>
  `;
}

function toggleCategory(header) {
  header.parentElement.classList.toggle('collapsed');
}

function searchFunctions() {
  const query = document.getElementById('function-search').value.toLowerCase();
  const chips = document.querySelectorAll('.function-chip');
  
  chips.forEach(chip => {
    const name = chip.querySelector('.chip-name').textContent.toLowerCase();
    const signature = chip.dataset.signature.toLowerCase();
    const matches = name.includes(query) || signature.includes(query);
    chip.style.display = matches ? 'flex' : 'none';
  });
}

function setupDragAndDrop() {
  document.addEventListener('dragover', (e) => {
    if (e.target.classList.contains('expression-input')) {
      e.preventDefault();
      e.target.classList.add('drag-over');
    }
  });
  
  document.addEventListener('dragleave', (e) => {
    if (e.target.classList.contains('expression-input')) {
      e.target.classList.remove('drag-over');
    }
  });
  
  document.addEventListener('drop', (e) => {
    if (e.target.classList.contains('expression-input')) {
      e.preventDefault();
      e.target.classList.remove('drag-over');
      handleFunctionDrop(e);
    }
  });
}

function attachDragHandlers() {
  const chips = document.querySelectorAll('.function-chip');
  chips.forEach(chip => {
    chip.addEventListener('dragstart', handleFunctionDragStart);
    chip.addEventListener('dragend', handleFunctionDragEnd);
  });
}

function handleFunctionDragStart(e) {
  const chip = e.currentTarget;
  const signature = chip.dataset.signature;
  e.dataTransfer.setData('text/plain', signature);
  e.dataTransfer.effectAllowed = 'copy';
  chip.classList.add('dragging');
}

function handleFunctionDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
}

function handleFunctionDrop(e) {
  const signature = e.dataTransfer.getData('text/plain');
  const input = e.target;
  const currentValue = input.value;
  const cursorPos = input.selectionStart;
  
  const newValue = currentValue.substring(0, cursorPos) + signature + currentValue.substring(cursorPos);
  input.value = newValue;
  input.focus();
  input.setSelectionRange(cursorPos + signature.length, cursorPos + signature.length);
  
  validateExpression(input);
}

function openExpressionBuilder(fieldId) {
  const mapping = state.mappings.find(m => m.id === state.currentMapping);
  const field = mapping?.fields.find(f => f.id === fieldId);
  
  if (!field) return;
  
  const modal = document.getElementById('expression-builder-modal');
  const formulaBar = document.getElementById('formula-bar');
  const previewPane = document.getElementById('expression-preview');
  
  formulaBar.value = field.expression || '';
  modal.classList.add('active');
  state.currentExpressionField = fieldId;
  
  renderFunctionComposer();
  updateExpressionPreview();
  
  formulaBar.focus();
}

function closeExpressionBuilder(save = false) {
  const modal = document.getElementById('expression-builder-modal');
  
  if (save) {
    const formulaBar = document.getElementById('formula-bar');
    const mapping = state.mappings.find(m => m.id === state.currentMapping);
    const field = mapping?.fields.find(f => f.id === state.currentExpressionField);
    
    if (field) {
      field.expression = formulaBar.value;
      field.transform = formulaBar.value ? 'expression' : 'direct';
      saveMappings();
      renderFieldMappings();
    }
  }
  
  modal.classList.remove('active');
  state.currentExpressionField = null;
}

function renderFunctionComposer() {
  const container = document.getElementById('function-composer');
  const formulaBar = document.getElementById('formula-bar');
  const expression = formulaBar.value;
  
  if (!expression) {
    container.innerHTML = '<div class="composer-empty">Drag functions here or type in the formula bar</div>';
    return;
  }
  
  container.innerHTML = `<div class="composer-expression">${escapeHtml(expression)}</div>`;
}

function updateExpressionPreview() {
  const formulaBar = document.getElementById('formula-bar');
  const previewPane = document.getElementById('expression-preview');
  const expression = formulaBar.value;
  
  if (!expression) {
    previewPane.innerHTML = '<div class="preview-empty">No expression to preview</div>';
    return;
  }
  
  const sampleData = [
    { name: 'John Doe', date: '2024-01-15', value: '100' },
    { name: 'Jane Smith', date: '2024-02-20', value: '200' }
  ];
  
  try {
    const results = sampleData.map(record => {
      const result = executeExpression(expression, record);
      return { input: record, output: result };
    });
    
    previewPane.innerHTML = `
      <div class="preview-success">
        <h4>Preview Results</h4>
        ${results.map((r, i) => `
          <div class="preview-result">
            <div class="preview-input"><strong>Input ${i + 1}:</strong> ${JSON.stringify(r.input)}</div>
            <div class="preview-output"><strong>Output:</strong> ${JSON.stringify(r.output)}</div>
          </div>
        `).join('')}
      </div>
    `;
  } catch (error) {
    previewPane.innerHTML = `
      <div class="preview-error">
        <h4>Error</h4>
        <p>${escapeHtml(error.message)}</p>
      </div>
    `;
  }
}

function executeExpression(expression, record) {
  const context = { ...record, ...createTransformFunctions() };
  try {
    return new Function('context', `with(context) { return ${expression}; }`)(context);
  } catch (error) {
    throw new Error(`Expression execution failed: ${error.message}`);
  }
}

function createTransformFunctions() {
  return {
    UPPER: (str) => String(str).toUpperCase(),
    LOWER: (str) => String(str).toLowerCase(),
    CONCAT: (...args) => args.join(''),
    TRIM: (str) => String(str).trim(),
    SUBSTRING: (str, start, length) => String(str).substring(start, length),
    REPLACE: (str, search, replace) => String(str).replace(new RegExp(search, 'g'), replace),
    NOW: () => new Date().toISOString(),
    DATEFORMAT: (date, format) => new Date(date).toLocaleDateString(),
    DATEADD: (date, days) => new Date(new Date(date).getTime() + days * 86400000).toISOString(),
    ADD: (...args) => args.reduce((a, b) => Number(a) + Number(b), 0),
    SUBTRACT: (a, b) => Number(a) - Number(b),
    MULTIPLY: (...args) => args.reduce((a, b) => Number(a) * Number(b), 1),
    DIVIDE: (a, b) => Number(a) / Number(b),
    IF: (condition, trueVal, falseVal) => condition ? trueVal : falseVal,
    IFNULL: (value, defaultVal) => value == null ? defaultVal : value,
    LENGTH: (arr) => Array.isArray(arr) ? arr.length : 0,
    FIRST: (arr) => Array.isArray(arr) ? arr[0] : null,
    LAST: (arr) => Array.isArray(arr) ? arr[arr.length - 1] : null,
    LOOKUP: (value, table) => table[value] || value
  };
}

function validateExpression(input) {
  const expression = input.value;
  const validationMsg = input.nextElementSibling;
  
  if (!expression) {
    validationMsg.textContent = '';
    validationMsg.className = 'validation-message';
    return;
  }
  
  try {
    executeExpression(expression, {});
    validationMsg.textContent = '✓ Valid expression';
    validationMsg.className = 'validation-message valid';
  } catch (error) {
    validationMsg.textContent = `✗ ${error.message}`;
    validationMsg.className = 'validation-message invalid';
  }
}

function openTemplateLibrary() {
  const modal = document.getElementById('template-library-modal');
  modal.classList.add('active');
  renderTemplateLibrary();
}

function closeTemplateLibrary() {
  document.getElementById('template-library-modal').classList.remove('active');
}

function renderTemplateLibrary() {
  const container = document.getElementById('template-list');
  
  if (state.expressionTemplates.length === 0) {
    container.innerHTML = '<div class="template-empty">No saved templates</div>';
    return;
  }
  
  container.innerHTML = state.expressionTemplates.map(template => `
    <div class="template-item">
      <div class="template-header">
        <strong>${escapeHtml(template.name)}</strong>
        <span class="template-date">${formatDate(template.created)}</span>
      </div>
      <div class="template-expression">${escapeHtml(template.expression)}</div>
      <div class="template-description">${escapeHtml(template.description)}</div>
      <div class="template-actions">
        <button onclick="useTemplate('${template.id}')" class="btn-secondary">Use</button>
        <button onclick="deleteTemplate('${template.id}')" class="btn-secondary">Delete</button>
      </div>
    </div>
  `).join('');
}

function useTemplate(id) {
  const template = state.expressionTemplates.find(t => t.id === id);
  if (template) {
    document.getElementById('formula-bar').value = template.expression;
    updateExpressionPreview();
    closeTemplateLibrary();
  }
}

function deleteTemplate(id) {
  if (confirm('Delete this template?')) {
    deleteExpressionTemplate(id);
    renderTemplateLibrary();
  }
}

function saveCurrentTemplate() {
  const name = prompt('Template name:');
  if (!name) return;
  
  const expression = document.getElementById('formula-bar').value;
  const description = prompt('Description (optional):') || '';
  
  saveExpressionTemplate(name, expression, description);
  alert('Template saved!');
}

// Modal Setup
function setupModalHandlers() {
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal')) {
      e.target.classList.remove('active');
    }
  });
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal.active').forEach(modal => {
        modal.classList.remove('active');
      });
    }
  });
}

// Initialize transformation system
initTransformationSystem();
</script>
