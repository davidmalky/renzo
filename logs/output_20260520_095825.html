// Global State Management
const appState = {
  currentUser: null,
  mappings: [],
  executionHistory: [],
  currentMapping: null,
  testResults: null,
  sampleData: null,
  liveRecords: [],

// Authentication & Session Management
function initAuth() {
  const stored = localStorage.getItem('mapTestUser');
  if (stored) {
    try {
      appState.currentUser = JSON.parse(stored);
      updateUIForAuth();
    } catch (e) {
      console.error('Auth init failed:', e);
      localStorage.removeItem('mapTestUser');
    }
  }
}

function login(email, password) {
  if (!email || !password) {
    showNotification('Email and password required', 'error');
    return false;
  }
  appState.currentUser = { email, id: Date.now(), name: email.split('@')[0] };
  localStorage.setItem('mapTestUser', JSON.stringify(appState.currentUser));
  updateUIForAuth();
  showNotification('Login successful', 'success');
  return true;
}

function logout() {
  appState.currentUser = null;
  localStorage.removeItem('mapTestUser');
  updateUIForAuth();
  showNotification('Logged out', 'info');
}

function updateUIForAuth() {
  const authSection = document.getElementById('authSection');
  const mainApp = document.getElementById('mainApp');
  if (appState.currentUser) {
    authSection?.classList.add('hidden');
    mainApp?.classList.remove('hidden');
  } else {
    authSection?.classList.remove('hidden');
    mainApp?.classList.add('hidden');
  }
}

// Data Management
function loadMappings() {
  const stored = localStorage.getItem('mappingConfigs');
  if (stored) {
    try {
      appState.mappings = JSON.parse(stored);
    } catch (e) {
      console.error('Failed to load mappings:', e);
      appState.mappings = [];
    }
  }
  return appState.mappings;
}

function saveMappings() {
  try {
    localStorage.setItem('mappingConfigs', JSON.stringify(appState.mappings));
    return true;
  } catch (e) {
    console.error('Failed to save mappings:', e);
    showNotification('Storage error', 'error');
    return false;
  }
}

function getMappingById(id) {
  return appState.mappings.find(m => m.id === id);
}

function createMapping(name, description) {
  const mapping = {
    id: `map_${Date.now()}`,
    name,
    description,
    fields: [],
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  appState.mappings.push(mapping);
  saveMappings();
  return mapping;
}

function updateMapping(id, updates) {
  const index = appState.mappings.findIndex(m => m.id === id);
  if (index !== -1) {
    appState.mappings[index] = {
      ...appState.mappings[index],
      ...updates,
      updatedAt: new Date().toISOString()
    };
    saveMappings();
    return true;
  }
  return false;
}

function deleteMapping(id) {
  const index = appState.mappings.findIndex(m => m.id === id);
  if (index !== -1) {
    appState.mappings.splice(index, 1);
    saveMappings();
    localStorage.removeItem(`testResults_${id}`);
    return true;
  }
  return false;
}

// Execution History Management
function loadExecutionHistory(mappingId) {
  const key = `execHistory_${mappingId}`;
  const stored = localStorage.getItem(key);
  if (stored) {
    try {
      return JSON.parse(stored);
    } catch (e) {
      return [];
    }
  }
  return [];
}

function saveExecutionHistory(mappingId, execution) {
  const key = `execHistory_${mappingId}`;
  let history = loadExecutionHistory(mappingId);
  history.unshift(execution);
  history = history.slice(0, 10);
  localStorage.setItem(key, JSON.stringify(history));
}

function clearExecutionHistory(mappingId) {
  localStorage.removeItem(`execHistory_${mappingId}`);
}

// Navigation & Routing
function navigateTo(view) {
  document.querySelectorAll('.view-container').forEach(v => {
    v.classList.add('hidden');
  });
  const target = document.getElementById(`${view}View`);
  if (target) {
    target.classList.remove('hidden');
    updateActiveNavItem(view);
  }
}

function updateActiveNavItem(view) {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.remove('active');
    if (item.dataset.view === view) {
      item.classList.add('active');
    }
  });
}

// Utility Functions
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func(...args), wait);
  };
}

function throttle(func, limit) {
  let inThrottle;
  return function(...args) {
    if (!inThrottle) {
      func.apply(this, args);
      inThrottle = true;
      setTimeout(() => inThrottle = false, limit);
    }
  };
}

function formatDate(dateString) {
  const date = new Date(dateString);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  if (diffMins < 60) return `${diffMins}m ago`;
  const diffHours = Math.floor(diffMins / 60);
  if (diffHours < 24) return `${diffHours}h ago`;
  const diffDays = Math.floor(diffHours / 24);
  if (diffDays < 7) return `${diffDays}d ago`;
  return date.toLocaleDateString();
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024;
  const sizes = ['Bytes', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
}

function sanitizeHTML(str) {
  const temp = document.createElement('div');
  temp.textContent = str;
  return temp.innerHTML;
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showNotification('Copied to clipboard', 'success');
    }).catch(err => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showNotification('Copied to clipboard', 'success');
  } catch (err) {
    showNotification('Copy failed', 'error');
  }
  document.body.removeChild(textarea);
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  downloadBlob(blob, filename);
}

function downloadCSV(data, filename) {
  const csv = convertToCSV(data);
  const blob = new Blob([csv], { type: 'text/csv' });
  downloadBlob(blob, filename);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function convertToCSV(data) {
  if (!Array.isArray(data) || data.length === 0) return '';
  const headers = Object.keys(data[0]);
  const rows = data.map(row => 
    headers.map(h => {
      const val = row[h];
      return typeof val === 'string' && val.includes(',') 
        ? `"${val}"` 
        : val;
    }).join(',')
  );
  return [headers.join(','), ...rows].join('\n');
}

function showNotification(message, type = 'info') {
  const container = document.getElementById('notificationContainer') || createNotificationContainer();
  const notification = document.createElement('div');
  notification.className = `notification notification-${type}`;
  notification.setAttribute('role', 'alert');
  notification.setAttribute('aria-live', 'polite');
  notification.innerHTML = `
    <span>${sanitizeHTML(message)}</span>
    <button class="notification-close" aria-label="Close notification">&times;</button>
  `;
  container.appendChild(notification);
  const closeBtn = notification.querySelector('.notification-close');
  closeBtn.onclick = () => removeNotification(notification);
  setTimeout(() => removeNotification(notification), 5000);
}

function createNotificationContainer() {
  const container = document.createElement('div');
  container.id = 'notificationContainer';
  container.className = 'notification-container';
  container.setAttribute('aria-live', 'polite');
  container.setAttribute('aria-atomic', 'true');
  document.body.appendChild(container);
  return container;
}

function removeNotification(notification) {
  notification.style.opacity = '0';
  notification.style.transform = 'translateX(400px)';
  setTimeout(() => notification.remove(), 300);
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validateURL(url) {
  try {
    new URL(url);
    return true;
  } catch {
    return false;
  }
}

function generateId(prefix = 'id') {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
}

                <input type="url" id="apiEndpoint" class="form-control" placeholder="https://api.example.com/data" aria-required="true">
              </div>
              <div class="form-group">
                <label for="authType">Authentication</label>
                <select id="authType" class="form-control" onchange="handleAuthTypeChange()">
                  <option value="none">None</option>
                  <option value="apikey">API Key</option>
                  <option value="bearer">Bearer Token</option>
                </select>
              </div>
              <div id="authFields"></div>
              <div class="form-group">
                <label for="requestMethod">Request Method</label>
                <select id="requestMethod" class="form-control">
                  <option value="GET">GET</option>
                  <option value="POST">POST</option>
                </select>
              </div>
              <div id="queryParams">
                <label>Query Parameters</label>
                <div id="paramsList"></div>
                <button class="btn btn-secondary btn-sm" onclick="addQueryParam()">+ Add Parameter</button>
              </div>
              <button class="btn btn-primary" onclick="fetchLiveData()">Fetch Records</button>
            </div>
            <div class="panel">
              <h3>Fetched Records <span id="recordCount" class="badge">0/10</span></h3>
              <div id="fetchedRecordsTable"></div>
            </div>

  `;
  document.body.appendChild(modal);
  activeModal = modal;
  loadExecutionHistory();
}

function openTestMappingModal(mappingId) {
  currentMappingId = mappingId;
  const mapping = mappings.find(m => m.id === mappingId);
  if (!mapping) {
    showNotification('Mapping not found', 'error');
    return;
  }
  if (!activeModal) initTestMappingModal();
  document.getElementById('testModalTitle').textContent = `Test Mapping: ${mapping.name}`;
  if (!mapping.fields || mapping.fields.length === 0) {
    showNotification('Warning: No fields configured in this mapping', 'warning');
  }
  const lastResults = loadLastResults(mappingId);
  if (lastResults) {
    currentTestResults = lastResults;
    displayResults(lastResults);
  }
  activeModal.style.display = 'flex';
  document.body.classList.add('modal-open');
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  setTimeout(() => activeModal.classList.add('active'), 10);
  document.addEventListener('keydown', handleModalKeydown);
  document.getElementById('sampleDataInput')?.focus();
}

function closeTestMappingModal() {
  if (!activeModal) return;
  activeModal.classList.remove('active');
  document.body.classList.remove('modal-open');
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  setTimeout(() => {
    activeModal.style.display = 'none';
  }, 300);
  document.removeEventListener('keydown', handleModalKeydown);
  currentMappingId = null;
}

function handleModalKeydown(e) {
  if (e.key === 'Escape') {
    closeTestMappingModal();
  } else if (e.key === 'Tab') {
    trapFocus(e);
  }
}

function trapFocus(e) {
  const focusableElements = activeModal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  const firstElement = focusableElements[0];
  const lastElement = focusableElements[focusableElements.length - 1];
  if (e.shiftKey && document.activeElement === firstElement) {
    e.preventDefault();
    lastElement.focus();
  } else if (!e.shiftKey && document.activeElement === lastElement) {
    e.preventDefault();
    firstElement.focus();
  }
}

function switchTab(tabName) {
  const tabs = ['sample', 'live', 'results'];
  document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
    const isActive = tabs[idx] === tabName;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', isActive);
  });
  document.querySelectorAll('.tab-content').forEach(content => {
    content.classList.remove('active');
  });
  const activeContent = document.getElementById(`${tabName}DataTab`) || document.getElementById(`${tabName}Tab`);
  if (activeContent) {
    activeContent.classList.add('active');
    announceToScreenReader(`Switched to ${tabName} tab`);
  }
  const primaryBtn = document.getElementById('primaryAction');
  if (tabName === 'sample') {
    primaryBtn.textContent = 'Test with Sample Data';
    primaryBtn.onclick = executeSampleTest;
  } else if (tabName === 'live') {
    primaryBtn.textContent = 'Fetch & Test';
    primaryBtn.onclick = fetchAndTest;
  } else {
    primaryBtn.textContent = 'Download Results';
    primaryBtn.onclick = downloadTestResults;
  }
}

function detectDataFormat(inputText) {
  const trimmed = inputText.trim();
  if (!trimmed) return null;
  if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
    try {
      JSON.parse(trimmed);
      return 'json';
    } catch {
      return null;
    }
  }
  if (trimmed.includes(',') && trimmed.split('\n').length > 1) {
    return 'csv';
  }
  return null;
}

function handleFormatChange() {
  const format = document.getElementById('dataFormat').value;
  const indicator = document.getElementById('formatIndicator');
  indicator.textContent = `Format: ${format.toUpperCase()}`;
  indicator.className = 'format-indicator success';
}

function loadSampleData() {
  const format = document.getElementById('dataFormat').value;
  const sampleData = format === 'json' ? generateSampleJSON() : generateSampleCSV();
  document.getElementById('sampleDataInput').value = sampleData;
  updateFormatIndicator(true, format);
  showNotification('Sample data loaded', 'success');
}

function generateSampleJSON() {
  return JSON.stringify([
    { id: 1, name: 'John Doe', email: 'john@example.com', status: 'active', created: '2024-01-15' },
    { id: 2, name: 'Jane Smith', email: 'jane@example.com', status: 'active', created: '2024-01-16' },
    { id: 3, name: 'Bob Johnson', email: 'bob@example.com', status: 'inactive', created: '2024-01-17' }
  ], null, 2);
}

function generateSampleCSV() {
  return `id,name,email,status,created
1,John Doe,john@example.com,active,2024-01-15
2,Jane Smith,jane@example.com,active,2024-01-16
3,Bob Johnson,bob@example.com,inactive,2024-01-17`;
}

function clearSampleData() {
  document.getElementById('sampleDataInput').value = '';
  updateFormatIndicator(false);
}

function updateFormatIndicator(valid, format = '') {
  const indicator = document.getElementById('formatIndicator');
  if (valid) {
    indicator.textContent = `✓ Valid ${format.toUpperCase()} detected`;
    indicator.className = 'format-indicator success';
  } else {
    indicator.textContent = '';
    indicator.className = 'format-indicator';
  }
}

function executeSampleTest() {
  const input = document.getElementById('sampleDataInput').value.trim();
  if (!input) {
    showNotification('Please provide sample data', 'error');
    return;
  }
  const format = detectDataFormat(input);
  if (!format) {
    showNotification('Invalid data format', 'error');
    return;
  }
  let records;
  try {
    records = format === 'json' ? JSON.parse(input) : parseCSV(input);
    if (!Array.isArray(records)) records = [records];
  } catch (err) {
    showNotification('Failed to parse data: ' + err.message, 'error');
    return;
  }
  executeMapping(records);
}

function parseCSV(csv) {
  const lines = csv.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const values = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
    return headers.reduce((obj, header, idx) => {
      obj[header] = values[idx];
      return obj;
    }, {});
  });
}

function executeMapping(inputRecords) {
  const mapping = mappings.find(m => m.id === currentMappingId);
  if (!mapping) return;
  const startTime = performance.now();
  const results = {
    success: [],
    errors: [],
    warnings: [],
    inputRecords,
    outputRecords: [],
    metrics: {}
  };
  inputRecords.forEach((record, idx) => {
    try {
      const output = transformRecord(record, mapping);
      const validation = validateRecord(output, mapping);
      if (validation.errors.length > 0) {
        results.errors.push({ recordIndex: idx, errors: validation.errors, record });
      } else {
        results.success.push({ input: record, output, index: idx });
        results.outputRecords.push(output);
      }
      if (validation.warnings.length > 0) {
        results.warnings.push({ recordIndex: idx, warnings: validation.warnings });
      }
    } catch (err) {
      results.errors.push({ recordIndex: idx, errors: [{ field: 'general', message: err.message }], record });
    }
  });
  const endTime = performance.now();
  results.metrics = {
    executionTime: (endTime - startTime).toFixed(2),
    totalRecords: inputRecords.length,
    successCount: results.success.length,
    errorCount: results.errors.length,
    warningCount: results.warnings.length
  };
  currentTestResults = results;
  saveTestResults(currentMappingId, results);
  addToExecutionHistory(currentMappingId, results);
  displayResults(results);
  switchTab('results');
  showNotification(`Test complete: ${results.success.length} succeeded, ${results.errors.length} failed`, results.errors.length > 0 ? 'warning' : 'success');
}

function transformRecord(input, mapping) {
  const output = {};
  mapping.fields.forEach(field => {
    let value = input[field.source];
    if (field.transformation) {
      value = applyTransformation(value, field.transformation, input);
    }
    if (field.defaultValue && (value === undefined || value === null || value === '')) {
      value = field.defaultValue;
    }
    output[field.target] = value;
  });
  return output;
}
