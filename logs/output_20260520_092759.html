// Data management, auth, navigation, and utility functions
let state = {
  currentView: 'list',
  mappings: [],
  currentMapping: null,
  draggedField: null,
  validationResults: [],
  schemaVersion: '1.0.0',
  systems: [
    { id: 'salesforce', name: 'Salesforce', icon: '☁️', fields: generateSampleFields('salesforce') },
    { id: 'hubspot', name: 'HubSpot', icon: '🎯', fields: generateSampleFields('hubspot') },
    { id: 'mysql', name: 'MySQL', icon: '🗄️', fields: generateSampleFields('mysql') },
    { id: 'postgres', name: 'PostgreSQL', icon: '🐘', fields: generateSampleFields('postgres') },
    { id: 'mongodb', name: 'MongoDB', icon: '🍃', fields: generateSampleFields('mongodb') }
  ]
};

function initializeApp() {
  loadMappings();
  setupKeyboardShortcuts();
  state.currentView = state.mappings.length > 0 ? 'list' : 'builder';
  renderCurrentView();
  announceToScreenReader('Application loaded. Use Tab to navigate.');
}

function loadMappings() {
  try {
    const stored = localStorage.getItem('dataMappings');
    if (stored) {
      const data = JSON.parse(stored);
      if (data.version !== state.schemaVersion) {
        state.mappings = migrateMappings(data.mappings, data.version);
      } else {
        state.mappings = data.mappings || [];
      }
    }
  } catch (e) {
    console.error('Failed to load mappings:', e);
    state.mappings = [];
  }
}

function saveMappings() {
  try {
    const data = {
      version: state.schemaVersion,
      mappings: state.mappings,
      lastModified: new Date().toISOString()
    };
    localStorage.setItem('dataMappings', JSON.stringify(data));
    return true;
  } catch (e) {
    console.error('Failed to save mappings:', e);
    showNotification('Failed to save mappings', 'error');
    return false;
  }
}

function migrateMappings(mappings, fromVersion) {
  console.log(`Migrating from version ${fromVersion} to ${state.schemaVersion}`);
  return mappings.map(m => ({
    ...m,
    version: state.schemaVersion,
    schedule: m.schedule || { frequency: 'manual' }
  }));
}

function setupKeyboardShortcuts() {
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 's') {
        e.preventDefault();
        if (state.currentView === 'builder' && state.currentMapping) {
          saveCurrentMapping();
        }
      }
    }
    if (e.key === 'Escape') {
      closeAllModals();
      if (state.currentView === 'builder') {
        navigateToList();
      }
    }
  });
}

function navigateToList() {
  state.currentView = 'list';
  state.currentMapping = null;
  renderCurrentView();
  announceToScreenReader('Navigated to mappings list');
}

function navigateToBuilder(mappingId = null) {
  state.currentView = 'builder';
  if (mappingId) {
    state.currentMapping = state.mappings.find(m => m.id === mappingId);
  } else {
    state.currentMapping = createNewMapping();
  }
  renderCurrentView();
  announceToScreenReader('Navigated to mapping builder');
}

function createNewMapping() {
  return {
    id: generateId(),
    name: '',
    description: '',
    sourceSystem: null,
    destinationSystem: null,
    fieldMappings: [],
    schedule: { frequency: 'manual' },
    batchSize: 1000,
    status: 'active',
    createdAt: new Date().toISOString(),
    lastModified: new Date().toISOString()
  };
}

function saveCurrentMapping() {
  if (!validateMapping(state.currentMapping)) {
    showNotification('Please fix validation errors before saving', 'error');
    return false;
  }
  
  state.currentMapping.lastModified = new Date().toISOString();
  const existingIndex = state.mappings.findIndex(m => m.id === state.currentMapping.id);
  
  if (existingIndex >= 0) {
    state.mappings[existingIndex] = state.currentMapping;
  } else {
    state.mappings.push(state.currentMapping);
  }
  
  if (saveMappings()) {
    showNotification('Mapping saved successfully', 'success');
    navigateToList();
    return true;
  }
  return false;
}

function deleteMapping(id) {
  const mapping = state.mappings.find(m => m.id === id);
  if (!mapping) return;
  
  showModal('deleteConfirm', { mappingName: mapping.name, mappingId: id });
}

function confirmDelete(id) {
  state.mappings = state.mappings.filter(m => m.id !== id);
  saveMappings();
  closeAllModals();
  showNotification('Mapping deleted', 'success');
  renderCurrentView();
  announceToScreenReader('Mapping deleted successfully');
}

function duplicateMapping(id) {
  const original = state.mappings.find(m => m.id === id);
  if (!original) return;
  
  const duplicate = {
    ...JSON.parse(JSON.stringify(original)),
    id: generateId(),
    name: `${original.name} (Copy)`,
    createdAt: new Date().toISOString(),
    lastModified: new Date().toISOString()
  };
  
  state.mappings.push(duplicate);
  saveMappings();
  showNotification('Mapping duplicated', 'success');
  renderCurrentView();
}

function toggleMappingStatus(id) {
  const mapping = state.mappings.find(m => m.id === id);
  if (mapping) {
    mapping.status = mapping.status === 'active' ? 'inactive' : 'active';
    saveMappings();
    renderCurrentView();
    announceToScreenReader(`Mapping ${mapping.status === 'active' ? 'activated' : 'deactivated'}`);
  }
}

function validateMapping(mapping) {
  state.validationResults = [];
  
  if (!mapping.name || mapping.name.trim() === '') {
    state.validationResults.push({
      level: 'error',
      field: 'name',
      message: 'Mapping name is required'
    });
  }
  
  if (!mapping.sourceSystem) {
    state.validationResults.push({
      level: 'error',
      field: 'sourceSystem',
      message: 'Source system is required'
    });
  }
  
  if (!mapping.destinationSystem) {
    state.validationResults.push({
      level: 'error',
      field: 'destinationSystem',
      message: 'Destination system is required'
    });
  }
  
  if (mapping.fieldMappings.length === 0) {
    state.validationResults.push({
      level: 'warning',
      field: 'fieldMappings',
      message: 'No field mappings defined'
    });
  }
  
  return state.validationResults.filter(r => r.level === 'error').length === 0;
}

function generateSampleFields(systemId) {
  const fields = {
    salesforce: [
      { name: 'Id', type: 'string', description: 'Unique identifier' },
      { name: 'FirstName', type: 'string', description: 'First name' },
      { name: 'LastName', type: 'string', description: 'Last name' },
      { name: 'Email', type: 'email', description: 'Email address' },
      { name: 'Phone', type: 'string', description: 'Phone number' },
      { name: 'CreatedDate', type: 'datetime', description: 'Creation date' }
    ],
    hubspot: [
      { name: 'vid', type: 'number', description: 'Visitor ID' },
      { name: 'firstname', type: 'string', description: 'First name' },
      { name: 'lastname', type: 'string', description: 'Last name' },
      { name: 'email', type: 'email', description: 'Email address' },
      { name: 'phone', type: 'string', description: 'Phone number' },
      { name: 'createdate', type: 'timestamp', description: 'Creation timestamp' }
    ]
  };
  return fields[systemId] || fields.salesforce;
}

function generateId() {
  return `map_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
}

function showNotification(message, type = 'info') {
  const notification = document.createElement('div');
  notification.className = `notification notification-${type}`;
  notification.textContent = message;
  notification.setAttribute('role', 'alert');
  notification.setAttribute('aria-live', 'polite');
  document.body.appendChild(notification);
  setTimeout(() => notification.classList.add('show'), 10);
  setTimeout(() => {
    notification.classList.remove('show');
    setTimeout(() => notification.remove(), 300);
  }, 3000);
}

function announceToScreenReader(message) {
  const announcer = document.getElementById('sr-announcer') || createAnnouncer();
  announcer.textContent = message;
}

function createAnnouncer() {
  const announcer = document.createElement('div');
  announcer.id = 'sr-announcer';
  announcer.setAttribute('aria-live', 'polite');
  announcer.setAttribute('aria-atomic', 'true');
  announcer.className = 'sr-only';
  document.body.appendChild(announcer);
  return announcer;
}

function exportMapping(id) {
  const mapping = state.mappings.find(m => m.id === id);
  if (mapping) {
    showModal('export', { mapping });
  }
}

function importMappings(jsonData) {
  try {
    const imported = JSON.parse(jsonData);
    const mappings = Array.isArray(imported) ? imported : [imported];
    
    mappings.forEach(m => {
      m.id = generateId();
      m.createdAt = new Date().toISOString();
      m.lastModified = new Date().toISOString();
      state.mappings.push(m);
    });
    
    saveMappings();
    showNotification(`Imported ${mappings.length} mapping(s)`, 'success');
    renderCurrentView();
  } catch (e) {
    showNotification('Invalid JSON format', 'error');
  }
}

// Field mapping modal interactions
function openFieldMappingModal(sourceField, destField = null) {
  state.currentFieldMapping = {
    source: sourceField,
    destination: destField,
    transformations: []
  };
  showModal('fieldMapping', { source: sourceField, destination: destField });
}

function addTransformation(type) {
  const transformation = {
    id: generateId(),
    type: type,
    config: getDefaultTransformConfig(type)
  };
  state.currentFieldMapping.transformations.push(transformation);
  renderTransformationPipeline();
  announceToScreenReader(`Added ${type} transformation`);
}

function removeTransformation(id) {
  state.currentFieldMapping.transformations = state.currentFieldMapping.transformations.filter(t => t.id !== id);
  renderTransformationPipeline();
  announceToScreenReader('Transformation removed');
}

function updateTransformationConfig(id, config) {
  const transform = state.currentFieldMapping.transformations.find(t => t.id === id);
  if (transform) {
    transform.config = { ...transform.config, ...config };
    updateTransformPreview();
  }
}

function getDefaultTransformConfig(type) {
  const configs = {
    uppercase: {},
    lowercase: {},
    trim: {},
    dateFormat: { format: 'YYYY-MM-DD' },
    concatenate: { separator: ' ', fields: [] },
    split: { delimiter: ',', index: 0 },
    lookup: { table: {}, defaultValue: '' },
    conditional: { condition: '', trueValue: '', falseValue: '' },
    customJS: { code: 'return value;' },
    defaultValue: { value: '' }
  };
  return configs[type] || {};
}

function saveFieldMapping() {
  if (!state.currentFieldMapping.destination) {
    showNotification('Please select a destination field', 'error');
    return;
  }
  
  const mapping = {
    id: generateId(),
    source: state.currentFieldMapping.source,
    destination: state.currentFieldMapping.destination,
    transformations: state.currentFieldMapping.transformations
  };
  
  state.currentMapping.fieldMappings.push(mapping);
  closeModal();
  renderMappingBuilder();
  announceToScreenReader('Field mapping saved');
}

function renderTransformationPipeline() {
  const container = document.getElementById('transformation-pipeline');
  if (!container) return;
  
  container.innerHTML = state.currentFieldMapping.transformations.map((t, idx) => `
    <div class="transformation-card" draggable="true" data-id="${t.id}" role="listitem" aria-label="${t.type} transformation">
      <div class="transform-header">
        <span class="drag-handle" aria-label="Drag to reorder">⋮⋮</span>
        <strong>${t.type}</strong>
        <button class="icon-btn" onclick="removeTransformation('${t.id}')" aria-label="Remove ${t.type} transformation">×</button>
      </div>
      <div class="transform-config">
        ${renderTransformConfig(t)}
      </div>
      ${idx < state.currentFieldMapping.transformations.length - 1 ? '<div class="transform-arrow">↓</div>' : ''}
    </div>
  `).join('') + `
    <button class="add-transform-btn" onclick="showTransformMenu()" aria-label="Add transformation">
      + Add Transformation
    </button>
  `;
  
  attachTransformationDragListeners();
  updateTransformPreview();
}

function renderTransformConfig(transform) {
  const configs = {
    dateFormat: `<input type="text" value="${transform.config.format}" onchange="updateTransformationConfig('${transform.id}', {format: this.value})" placeholder="YYYY-MM-DD" aria-label="Date format pattern">`,
    concatenate: `<input type="text" value="${transform.config.separator}" onchange="updateTransformationConfig('${transform.id}', {separator: this.value})" placeholder="Separator" aria-label="Concatenation separator">`,
    split: `<input type="text" value="${transform.config.delimiter}" onchange="updateTransformationConfig('${transform.id}', {delimiter: this.value})" placeholder="Delimiter" aria-label="Split delimiter">`,
    defaultValue: `<input type="text" value="${transform.config.value}" onchange="updateTransformationConfig('${transform.id}', {value: this.value})" placeholder="Default value" aria-label="Default value">`,
    customJS: `<textarea onchange="updateTransformationConfig('${transform.id}', {code: this.value})" placeholder="return value;" aria-label="Custom JavaScript code">${transform.config.code}</textarea>`
  };
  return configs[transform.type] || '';
}

function updateTransformPreview() {
  const preview = document.getElementById('transform-preview');
  if (!preview) return;
  
  const sampleValue = 'john.doe@example.com';
  let result = sampleValue;
  
  try {
    state.currentFieldMapping.transformations.forEach(t => {
      result = applyTransformation(result, t);
    });
    preview.innerHTML = `<div class="preview-box"><strong>Input:</strong> ${sampleValue}</div><div class="preview-box"><strong>Output:</strong> ${result}</div>`;
  } catch (e) {
    preview.innerHTML = `<div class="preview-box error">Error: ${e.message}</div>`;
  }
}

function applyTransformation(value, transform) {
  switch (transform.type) {
    case 'uppercase': return String(value).toUpperCase();
    case 'lowercase': return String(value).toLowerCase();
    case 'trim': return String(value).trim();
    case 'dateFormat': return value;
    case 'defaultValue': return value || transform.config.value;
    default: return value;
  }
}

function attachTransformationDragListeners() {
  const cards = document.querySelectorAll('.transformation-card');
  let draggedElement = null;
  
  cards.forEach(card => {
    card.addEventListener('dragstart', (e) => {
      draggedElement = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
    });
    
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(card.parentElement, e.clientY);
      if (afterElement == null) {
        card.parentElement.appendChild(draggedElement);
      } else {
        card.parentElement.insertBefore(draggedElement, afterElement);
      }
    });
    
    card.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' && e.altKey) {
        moveTransformationUp(card.dataset.id);
      } else if (e.key === 'ArrowDown' && e.altKey) {
        moveTransformationDown(card.dataset.id);
      }
    });
  });
}

function moveTransformationUp(id) {
  const idx = state.currentFieldMapping.transformations.findIndex(t => t.id === id);
  if (idx > 0) {
    [state.currentFieldMapping.transformations[idx], state.currentFieldMapping.transformations[idx - 1]] = 
    [state.currentFieldMapping.transformations[idx - 1], state.currentFieldMapping.transformations[idx]];
    renderTransformationPipeline();
    announceToScreenReader('Transformation moved up');
  }
}

function moveTransformationDown(id) {
  const idx = state.currentFieldMapping.transformations.findIndex(t => t.id === id);
  if (idx < state.currentFieldMapping.transformations.length - 1) {
    [state.currentFieldMapping.transformations[idx], state.currentFieldMapping.transformations[idx + 1]] = 
    [state.currentFieldMapping.transformations[idx + 1], state.currentFieldMapping.transformations[idx]];
    renderTransformationPipeline();
    announceToScreenReader('Transformation moved down');
  }
}

function getDragAfterElement(container, y) {
  const draggableElements = [...container.querySelectorAll('.transformation-card:not(.dragging)')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    if (state.currentView === 'builder') {
      saveCurrentMapping();
    }
  } else if (e.key === 'Escape') {
    if (state.modal.isOpen) {
      closeModal();
    } else if (state.currentView === 'builder') {
      cancelMapping();
    }
  }
});

// Initialize on load
document.addEventListener('DOMContentLoaded', () => {
  initializeApp();
});
</script>
</body>
</html>
