<script>
// Core Data Management
const StorageKeys = {
  MAPPINGS: 'syncMappings',
  USER_SESSION: 'userSession',
  SETTINGS: 'appSettings'
};

const Storage = {
  get(key) {
    try {
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : null;
    } catch (e) {
      console.error('Storage get error:', e);
      return null;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('Storage set error:', e);
      return false;
    }
  },
  remove(key) {
    localStorage.removeItem(key);
  },
  clear() {
    localStorage.clear();
  }
};

// Initialize storage schema
function initializeStorage() {
  if (!Storage.get(StorageKeys.MAPPINGS)) {
    Storage.set(StorageKeys.MAPPINGS, []);
  }
  if (!Storage.get(StorageKeys.USER_SESSION)) {
    Storage.set(StorageKeys.USER_SESSION, {
      userId: 'user_' + Date.now(),
      username: 'Demo User',
      authenticated: true,
      lastLogin: new Date().toISOString()
    });
  }
  if (!Storage.get(StorageKeys.SETTINGS)) {
    Storage.set(StorageKeys.SETTINGS, {
      theme: 'light',
      pageSize: 10,
      defaultSyncInterval: 300
    });
  }
}

// Authentication
const Auth = {
  getSession() {
    return Storage.get(StorageKeys.USER_SESSION);
  },
  isAuthenticated() {
    const session = this.getSession();
    return session && session.authenticated;
  },
  logout() {
    Storage.remove(StorageKeys.USER_SESSION);
    Router.navigate('login');
  }
};

// Router
const Router = {
  currentView: 'list',
  routes: {
    'list': 'renderMappingListView',
    'create': 'renderMappingWizardView',
    'edit': 'renderMappingWizardView',
    'test': 'renderMappingTestPanel'
  },
  navigate(view, params = {}) {
    this.currentView = view;
    window.location.hash = view + (params.id ? '/' + params.id : '');
    this.render();
  },
  render() {
    const handler = this.routes[this.currentView];
    if (handler && typeof window[handler] === 'function') {
      window[handler]();
    }
  },
  init() {
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.slice(1);
      const [view, id] = hash.split('/');
      this.currentView = view || 'list';
      this.render();
    });
    const hash = window.location.hash.slice(1);
    this.currentView = hash.split('/')[0] || 'list';
  }
};

// Utility Functions
function generateId() {
  return 'map_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
}

function formatDate(dateString) {
  const date = new Date(dateString);
  return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}

function sanitizeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Toast Notifications
const Toast = {
  container: null,
  init() {
    if (!this.container) {
      this.container = document.createElement('div');
      this.container.className = 'toast-container';
      this.container.setAttribute('aria-live', 'polite');
      this.container.setAttribute('aria-atomic', 'true');
      document.body.appendChild(this.container);
    }
  },
  show(message, type = 'info', duration = 4000) {
    this.init();
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.setAttribute('role', 'alert');
    toast.innerHTML = `
      <div class="toast-message">${sanitizeHTML(message)}</div>
      <button class="toast-close" aria-label="Close notification">&times;</button>
    `;
    this.container.appendChild(toast);
    const closeBtn = toast.querySelector('.toast-close');
    const remove = () => {
      toast.style.animation = 'slideIn 0.3s ease reverse';
      setTimeout(() => toast.remove(), 300);
    };
    closeBtn.addEventListener('click', remove);
    if (duration > 0) {
      setTimeout(remove, duration);
    }
  },
  success(message) {
    this.show(message, 'success');
  },
  error(message) {
    this.show(message, 'error', 6000);
  },
  warning(message) {
    this.show(message, 'warning');
  }
};

// Modal Management
const Modal = {
  stack: [],
  show(config) {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', 'modal-title');
    modal.innerHTML = `
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title">${sanitizeHTML(config.title)}</h2>
          <button class="modal-close" aria-label="Close dialog">&times;</button>
        </div>
        <div class="modal-body">${config.body}</div>
        <div class="modal-footer">
          ${config.actions.map(action => `
            <button class="btn btn-${action.type || 'secondary'}" data-action="${action.id}">${sanitizeHTML(action.label)}</button>
          `).join('')}
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    this.stack.push(modal);
    setTimeout(() => modal.classList.add('active'), 10);
    const focusableElements = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    const firstElement = focusableElements[0];
    const lastElement = focusableElements[focusableElements.length - 1];
    firstElement?.focus();
    const trapFocus = (e) => {
      if (e.key === 'Tab') {
        if (e.shiftKey && document.activeElement === firstElement) {
          e.preventDefault();
          lastElement.focus();
        } else if (!e.shiftKey && document.activeElement === lastElement) {
          e.preventDefault();
          firstElement.focus();
        }
      } else if (e.key === 'Escape') {
        this.close();
      }
    };
    modal.addEventListener('keydown', trapFocus);
    modal.querySelector('.modal-close').addEventListener('click', () => this.close());
    modal.addEventListener('click', (e) => {
      if (e.target === modal) this.close();
    });
    config.actions.forEach(action => {
      modal.querySelector(`[data-action="${action.id}"]`)?.addEventListener('click', () => {
        if (action.handler) action.handler();
        this.close();
      });
    });
  },
  close() {
    const modal = this.stack.pop();
    if (modal) {
      modal.classList.remove('active');
      setTimeout(() => modal.remove(), 300);
    }
  }
};

// Form Validation
const Validator = {
  rules: {
    required: (value) => value?.toString().trim().length > 0,
    email: (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value),
    url: (value) => /^https?:\/\/.+/.test(value),
    minLength: (value, min) => value?.toString().length >= min,
    maxLength: (value, max) => value?.toString().length <= max
  },
  validate(input, rules) {
    for (let rule of rules) {
      const [ruleName, ...params] = rule.split(':');
      if (!this.rules[ruleName](input.value, ...params)) {
        return false;
      }
    }
    return true;
  },
  markError(input, message) {
    input.classList.add('error');
    input.setAttribute('aria-invalid', 'true');
    let error = input.nextElementSibling;
    if (!error || !error.classList.contains('form-error')) {
      error = document.createElement('div');
      error.className = 'form-error';
      error.setAttribute('role', 'alert');
      input.parentNode.insertBefore(error, input.nextSibling);
    }
    error.textContent = message;
  },
  clearError(input) {
    input.classList.remove('error');
    input.removeAttribute('aria-invalid');
    const error = input.nextElementSibling;
    if (error?.classList.contains('form-error')) {
      error.textContent = '';
    }
  }
};

// Initialize application
function initializeMappingInterface() {
  initializeStorage();
  if (!Auth.isAuthenticated()) {
    window.location.href = '/login.html';
    return;
  }
  Router.init();
  Router.render();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && Modal.stack.length > 0) {
      Modal.close();
    }
  });
}

document.addEventListener('DOMContentLoaded', initializeMappingInterface);
</script>

<script>
// Feature JavaScript - Mapping List View
function renderMappingListView() {
  const mappings = loadMappings({}, 'name', 'asc', 1, 20);
  const stats = calculateStats(mappings.mappings);
  const html = `
    <div class="mapping-list-view">
      <div class="page-header">
        <h1>Sync Mappings</h1>
        <button class="btn btn-primary" onclick="Router.navigate('/mappings/new')">
          <span class="icon">+</span> Create New Mapping
        </button>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">${stats.total}</div>
          <div class="stat-label">Total Mappings</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.active}</div>
          <div class="stat-label">Active Mappings</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.successRate}%</div>
          <div class="stat-label">Success Rate</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.last24h}</div>
          <div class="stat-label">Syncs (24h)</div>
        </div>
      </div>
      <div class="table-controls">
        <input type="search" placeholder="Search mappings..." class="search-input" 
               id="mappingSearch" aria-label="Search mappings">
        <select id="directionFilter" aria-label="Filter by direction">
          <option value="">All Directions</option>
          <option value="salesforce-to-target">Salesforce → Target</option>
          <option value="target-to-salesforce">Target → Salesforce</option>
          <option value="bidirectional">Bidirectional</option>
        </select>
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="paused">Paused</option>
          <option value="error">Error</option>
        </select>
      </div>
      ${renderMappingTable(mappings.mappings)}
    </div>
  `;
  document.getElementById('app').innerHTML = html;
  attachListViewHandlers();
}

function loadMappings(filters, sortBy, sortOrder, page, pageSize) {
  let mappings = Storage.get('syncMappings') || [];
  if (filters.status) mappings = mappings.filter(m => m.status === filters.status);
  if (filters.direction) mappings = mappings.filter(m => m.direction === filters.direction);
  if (filters.search) {
    const term = filters.search.toLowerCase();
    mappings = mappings.filter(m => 
      m.name.toLowerCase().includes(term) || 
      m.description?.toLowerCase().includes(term)
    );
  }
  mappings.sort((a, b) => {
    const order = sortOrder === 'asc' ? 1 : -1;
    return a[sortBy] > b[sortBy] ? order : -order;
  });
  const start = (page - 1) * pageSize;
  return {
    mappings: mappings.slice(start, start + pageSize),
    total: mappings.length,
    page
  };
}

function calculateStats(mappings) {
  const total = mappings.length;
  const active = mappings.filter(m => m.status === 'active').length;
  const totalRuns = mappings.reduce((sum, m) => sum + (m.stats?.totalRuns || 0), 0);
  const successRuns = mappings.reduce((sum, m) => sum + (m.stats?.successRuns || 0), 0);
  const successRate = totalRuns > 0 ? Math.round((successRuns / totalRuns) * 100) : 0;
  const last24h = mappings.reduce((sum, m) => sum + (m.stats?.last24h || 0), 0);
  return { total, active, successRate, last24h };
}

function renderMappingTable(mappings) {
  const rows = mappings.map(m => `
    <tr data-id="${m.id}">
      <td>${m.name}</td>
      <td><span class="badge badge-${m.direction}">${m.direction}</span></td>
      <td>${m.sourceObject}</td>
      <td>${m.targetObject}</td>
      <td><span class="status-badge status-${m.status}">${m.status}</span></td>
      <td>${new Date(m.lastSync || Date.now()).toLocaleString()}</td>
      <td class="actions">
        <button class="btn-icon" onclick="editMapping('${m.id}')" aria-label="Edit mapping">✏️</button>
        <button class="btn-icon" onclick="toggleMapping('${m.id}')" aria-label="${m.status === 'active' ? 'Pause' : 'Resume'} mapping">
          ${m.status === 'active' ? '⏸️' : '▶️'}
        </button>
        <button class="btn-icon" onclick="duplicateMapping('${m.id}')" aria-label="Duplicate mapping">📋</button>
        <button class="btn-icon" onclick="deleteMapping('${m.id}')" aria-label="Delete mapping">🗑️</button>
      </td>
    </tr>
  `).join('');
  return `
    <table class="mapping-table" role="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Direction</th>
          <th>Source Object</th>
          <th>Target Object</th>
          <th>Status</th>
          <th>Last Sync</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function attachListViewHandlers() {
  const searchInput = document.getElementById('mappingSearch');
  const directionFilter = document.getElementById('directionFilter');
  const statusFilter = document.getElementById('statusFilter');
  let debounceTimer;
  const filterMappings = () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const filters = {
        search: searchInput.value,
        direction: directionFilter.value,
        status: statusFilter.value
      };
      const mappings = loadMappings(filters, 'name', 'asc', 1, 20);
      const tbody = document.querySelector('.mapping-table tbody');
      tbody.innerHTML = renderMappingTable(mappings.mappings).match(/<tbody>(.*)<\/tbody>/s)[1];
    }, 300);
  };
  searchInput.addEventListener('input', filterMappings);
  directionFilter.addEventListener('change', filterMappings);
  statusFilter.addEventListener('change', filterMappings);
}

function editMapping(id) {
  Router.navigate(`/mappings/edit/${id}`);
}

function toggleMapping(id) {
  const mappings = Storage.get('syncMappings') || [];
  const mapping = mappings.find(m => m.id === id);
  if (mapping) {
    mapping.status = mapping.status === 'active' ? 'paused' : 'active';
    Storage.set('syncMappings', mappings);
    Toast.show(`Mapping ${mapping.status === 'active' ? 'resumed' : 'paused'}`, 'success');
    renderMappingListView();
  }
}

function duplicateMapping(id) {
  const mappings = Storage.get('syncMappings') || [];
  const mapping = mappings.find(m => m.id === id);
  if (mapping) {
    const duplicate = { ...mapping, id: generateId(), name: `${mapping.name} (Copy)`, status: 'paused' };
    mappings.push(duplicate);
    Storage.set('syncMappings', mappings);
    Toast.show('Mapping duplicated successfully', 'success');
    renderMappingListView();
  }
}

function deleteMapping(id) {
  const mappings = Storage.get('syncMappings') || [];
  const mapping = mappings.find(m => m.id === id);
  Modal.open({
    title: 'Delete Mapping',
    content: `<p>Are you sure you want to delete "${mapping?.name}"? This action cannot be undone.</p>`,
    actions: [
      { id: 'cancel', label: 'Cancel', type: 'secondary' },
      { id: 'delete', label: 'Delete', type: 'danger', handler: () => {
        Storage.set('syncMappings', mappings.filter(m => m.id !== id));
        Toast.show('Mapping deleted', 'success');
        renderMappingListView();
      }}
    ]
  });
}

// Mapping Wizard
function renderMappingWizardView(id) {
  const mapping = id ? (Storage.get('syncMappings') || []).find(m => m.id === id) : null;
  const wizardState = Storage.get('wizardState') || {
    step: 1,
    data: mapping || { id: generateId(), name: '', description: '', direction: '', sourceObject: '', targetObject: '', fieldMappings: [], transformations: [], validationRules: [], conflictResolution: 'sourceWins', schedule: { type: 'manual' }, status: 'paused' }
  };
  const html = `
    <div class="wizard-container">
      <div class="wizard-header">
        <h1>${mapping ? 'Edit' : 'Create'} Sync Mapping</h1>
        <div class="wizard-progress" role="progressbar" aria-valuenow="${wizardState.step}" aria-valuemin="1" aria-valuemax="8">
          ${[1,2,3,4,5,6,7,8].map(i => `
            <div class="step ${i < wizardState.step ? 'completed' : ''} ${i === wizardState.step ? 'active' : ''}">
              <div class="step-number">${i}</div>
              <div class="step-label">${getStepLabel(i)}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="wizard-content">${renderWizardStep(wizardState)}</div>
      <div class="wizard-footer">
        <button class="btn btn-secondary" ${wizardState.step === 1 ? 'disabled' : ''} onclick="wizardPrevious()">Previous</button>
        <button class="btn btn-secondary" onclick="Router.navigate('/mappings')">Cancel</button>
        ${wizardState.step < 8 ? 
          `<button class="btn btn-primary" onclick="wizardNext()">Next</button>` : 
          `<button class="btn btn-primary" onclick="wizardSave()">Save Mapping</button>`
        }
      </div>
    </div>
  `;
  document.getElementById('app').innerHTML = html;
  attachWizardHandlers();
}

function getStepLabel(step) {
  const labels = ['Basic Info', 'Objects', 'Field Mapping', 'Transformations', 'Validation', 'Conflict Resolution', 'Schedule', 'Review'];
  return labels[step - 1];
}

function renderWizardStep(state) {
  switch(state.step) {
    case 1: return renderBasicInfoStep(state.data);
    case 2: return renderObjectSelectionStep(state.data);
    case 3: return renderFieldMappingStep(state.data);
    case 4: return renderTransformationStep(state.data);
    case 5: return renderValidationStep(state.data);
    case 6: return renderConflictResolutionStep(state.data);
    case 7: return renderScheduleStep(state.data);
    case 8: return renderReviewStep(state.data);
  }
}

function renderBasicInfoStep(data) {
  return `
    <div class="form-group">
      <label for="mappingName">Mapping Name <span class="required">*</span></label>
      <input type="text" id="mappingName" value="${data.name}" required aria-required="true">
    </div>
    <div class="form-group">
      <label for="mappingDescription">Description</label>
      <textarea id="mappingDescription" rows="3">${data.description || ''}</textarea>
    </div>
    <div class="form-group">
      <label for="mappingDirection">Sync Direction <span class="required">*</span></label>
      <select id="mappingDirection" required aria-required="true">
        <option value="">Select direction...</option>
        <option value="salesforce-to-target" ${data.direction === 'salesforce-to-target' ? 'selected' : ''}>Salesforce → Target</option>
        <option value="target-to-salesforce" ${data.direction === 'target-to-salesforce' ? 'selected' : ''}>Target → Salesforce</option>
        <option value="bidirectional" ${data.direction === 'bidirectional' ? 'selected' : ''}>Bidirectional</option>
      </select>
    </div>
  `;
}

function renderObjectSelectionStep(data) {
  const sfObjects = ['Account', 'Contact', 'Opportunity', 'Lead', 'Case', 'Custom_Object__c'];
  return `
    <div class="form-group">
      <label for="sourceObject">Source Object <span class="required">*</span></label>
      <select id="sourceObject" required aria-required="true">
        <option value="">Select object...</option>
        ${sfObjects.map(obj => `<option value="${obj}" ${data.sourceObject === obj ? 'selected' : ''}>${obj}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label for="targetObject">Target Object <span class="required">*</span></label>
      <input type="text" id="targetObject" value="${data.targetObject}" required aria-required="true" placeholder="e.g., users, products">
    </div>
  `;
}

function renderFieldMappingStep(data) {
  const sourceFields = ['Id', 'Name', 'Email', 'Phone', 'CreatedDate', 'LastModifiedDate'];
  const mappings = data.fieldMappings || [];
  return `
    <div class="field-mapping-canvas">
      <div class="field-panel source-fields">
        <h3>Source Fields</h3>
        <ul id="sourceFieldList">
          ${sourceFields.map(f => `<li data-field="${f}">${f}</li>`).join('')}
        </ul>
      </div>
      <div class="mapping-connections" id="mappingConnections">
        ${mappings.map((m, i) => `
          <div class="field-mapping" data-index="${i}">
            <span>${m.source}</span> → <span>${m.target}</span>
            <button onclick="removeFieldMapping(${i})" aria-label="Remove mapping">×</button>
          </div>
        `).join('')}
      </div>
      <div class="field-panel target-fields">
        <h3>Target Fields</h3>
</body>
</html>
