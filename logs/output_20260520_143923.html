<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renzo - Smart CRM with AI Outreach</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --forest-green: #2d5016;
  --forest-green-hover: #1f3810;
  --forest-green-light: #e8f3e0;
  --cream: #f5f1e8;
  --cream-dark: #e8e1d0;
  --gold: #c5a028;
  --gold-light: #f5e8b8;
  --error: #dc2626;
  --error-light: #fee2e2;
  --success: #16a34a;
  --success-light: #dcfce7;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --priority-critical: #dc2626;
  --priority-high: #f97316;
  --priority-medium: #eab308;
  --priority-low: #22c55e;
  --text-primary: #1a1a1a;
  --text-secondary: #4b5563;
  --border: #d1d5db;
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
  --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--cream);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}

*:focus {
  outline: 3px solid var(--forest-green);
  outline-offset: 2px;
}

.app-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  padding: 24px;
  background: white;
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  color: var(--forest-green);
}

.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn:focus-visible {
  outline: 3px solid var(--forest-green);
  outline-offset: 2px;
}

.btn-primary {
  background: var(--forest-green);
  color: white;
}

.btn-primary:hover {
  background: var(--forest-green-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  background: white;
  color: var(--forest-green);
  border: 2px solid var(--forest-green);
}

.btn-secondary:hover {
  background: var(--forest-green-light);
}

.btn-danger {
  background: var(--error);
  color: white;
}

.btn-danger:hover {
  background: #b91c1c;
}

.btn-small {
  padding: 6px 12px;
  font-size: 13px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: var(--forest-green);
  font-size: 14px;
}

.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.2s;
}

.form-input:focus {
  border-color: var(--forest-green);
  outline: none;
}

.form-input[aria-invalid="true"] {
  border-color: var(--error);
}

.form-error {
  color: var(--error);
  font-size: 13px;
  margin-top: 6px;
  display: none;
}

.form-error.visible {
  display: block;
}

textarea.form-input {
  resize: vertical;
  min-height: 100px;
}

.priority-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  color: white;
  min-width: 42px;
}

.priority-critical {
  background: var(--priority-critical);
}

.priority-high {
  background: var(--priority-high);
}

.priority-medium {
  background: var(--priority-medium);
}

.priority-low {
  background: var(--priority-low);
}

.priority-score-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  color: white;
  min-width: 50px;
  margin-right: 12px;
}

.priority-score-high {
  background: linear-gradient(135deg, var(--priority-critical), var(--priority-high));
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
}

.priority-score-medium {
  background: linear-gradient(135deg, var(--priority-high), var(--priority-medium));
  box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
}

.priority-score-low {
  background: linear-gradient(135deg, var(--priority-medium), var(--priority-low));
  box-shadow: 0 2px 8px rgba(234, 179, 8, 0.3);
}

.contact-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
}

.contact-row:hover {
  background: var(--cream);
}

.contact-row:last-child {
  border-bottom: none;
}

.contact-info {
  flex: 1;
  display: flex;
  align-items: center;
}

.contact-details {
  flex: 1;
}

.contact-name {
  font-weight: 600;
  font-size: 16px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.contact-company {
  color: var(--text-secondary);
  font-size: 14px;
}

.contact-actions {
  display: flex;
  gap: 8px;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: white;
  border-radius: 12px;
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  animation: modalSlideIn 0.3s ease-out;
}

@keyframes modalSlideIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.modal-header {
  padding: 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--forest-green);
}

.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: background 0.2s;
}

.modal-close:hover {
  background: var(--cream);
}

.modal-body {
  padding: 24px;
}

.modal-footer {
  padding: 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

.search-container {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  align-items: center;
}

.search-input {
  flex: 1;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
}

.search-input:focus {
  border-color: var(--forest-green);
  outline: none;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state-text {
  font-size: 16px;
  margin-bottom: 24px;
}

.alert {
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.alert-success {
  background: var(--success-light);
  color: var(--success);
  border: 1px solid var(--success);
}

.alert-error {
  background: var(--error-light);
  color: var(--error);
  border: 1px solid var(--error);
}

.alert-warning {
  background: var(--warning-light);
  color: var(--warning);
  border: 1px solid var(--warning);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

.csv-preview-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 14px;
}

.csv-preview-table th {
  background: var(--forest-green-light);
  color: var(--forest-green);
  padding: 12px;
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--forest-green);
}

.csv-preview-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

.csv-preview-table tr:last-child td {
  border-bottom: none;
}

.csv-preview-table tr:hover {
  background: var(--cream);
}

.mapping-summary {
  background: var(--forest-green-light);
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.mapping-summary h4 {
  color: var(--forest-green);
  margin-bottom: 12px;
  font-size: 14px;
  font-weight: 600;
}

.mapping-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px;
}

.mapping-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.mapping-item strong {
  color: var(--forest-green);
}

.warning-text {
  color: var(--warning);
  font-size: 13px;
  margin-top: 16px;
  padding: 12px;
  background: var(--warning-light);
  border-radius: 6px;
  border-left: 3px solid var(--warning);
}

.result-message {
  text-align: center;
  padding: 20px;
  font-size: 16px;
  line-height: 1.6;
}

.result-message strong {
  color: var(--forest-green);
  font-weight: 700;
}

.hidden {
  display: none !important;
}

.loading-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

[role="status"][aria-live="polite"] {
  position: absolute;
  left: -10000px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

.modal-overlay:focus {
  outline: none;
}

.modal:focus {
  outline: 3px solid var(--forest-green);
  outline-offset: -3px;
}

@media (max-width: 768px) {
  .app-container {
    padding: 16px;
  }
  
  .header {
    flex-direction: column;
    gap: 16px;
    align-items: flex-start;
  }
</body>
</html>
