<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 280px;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    color: #1a1a14;
  }
  .renzo-logo {
    font-family: Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    color: #1F6B47;
    margin-bottom: 2px;
  }
  .renzo-sub {
    font-size: 12px;
    color: #6B7280;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1.5px solid #E2D9CC;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  input:focus {
    outline: none;
    border-color: #1F6B47;
  }
  button {
    width: 100%;
    background: #1F6B47;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover {
    background: #185939;
  }
  #status {
    font-size: 12px;
    color: #1F6B47;
    margin-top: 8px;
    min-height: 14px;
  }
  .renzo-link {
    display: block;
    font-size: 11px;
    color: #6B7280;
    margin-top: 14px;
    text-decoration: none;
  }
  .renzo-link:hover {
    color: #1F6B47;
  }
</style>
</head>
<body>
  <div class="renzo-logo">Renzo</div>
  <div class="renzo-sub">AI outreach for Gmail, LinkedIn &amp; Salesforce</div>

  <label for="apiKeyInput">Your Renzo API Key</label>
  <input id="apiKeyInput" type="text" placeholder="renzo_...">
  <button id="saveBtn">Save</button>
  <div id="status"></div>

  <a class="renzo-link" href="https://meetrenzo.com/app" target="_blank">Get your API key at meetrenzo.com/app → Settings</a>

  <script src="popup.js"></script>
</body>
</html>
